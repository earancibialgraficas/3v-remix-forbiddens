<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monopolio Arcade</title>
  <style>
    *{box-sizing:border-box;scrollbar-color:#facc15 #08111f;scrollbar-width:thin}
    html,body{height:100%;margin:0;background:#07111f;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:#08111f}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#facc15,#22d3ee);border:2px solid #08111f;border-radius:999px}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);background:radial-gradient(circle at 50% -10%,#15345e 0,#07111f 48%,#030712 100%)}
    body.embedded{grid-template-rows:minmax(0,1fr)}
    body.embedded .top{display:none}
    button,input{min-height:32px;border:1px solid #365273;border-radius:8px;background:#0e1b2d;color:#fff;padding:6px 10px;font:inherit;font-size:12px;box-shadow:inset 0 0 12px #0008}
    button{cursor:pointer;border-color:#facc15;background:linear-gradient(#23334f,#111827);font-weight:1000;box-shadow:0 2px 0 #8a5b00,0 0 14px #facc152d}
    button:disabled{opacity:.5;cursor:not-allowed}
    .top{display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 10px;background:#050914d9;border-bottom:1px solid #facc1526}
    .brand{font-weight:1000;color:#facc15;text-shadow:0 0 14px #facc1544;white-space:nowrap}
    .roomControls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.roomControls input{text-transform:uppercase;width:108px}
    .status{margin-left:auto;color:#cbd5e1;font-size:12px;text-align:right}.roomBadge{display:inline-flex;align-items:center;gap:5px;border:1px solid #22d3ee55;border-radius:999px;background:#061a2c;padding:5px 9px;color:#22d3ee;font-weight:1000}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,340px);gap:12px;padding:12px}
    .boardWrap,.side{min-height:0;border:1px solid #facc152b;background:#07111fd9;border-radius:14px;box-shadow:inset 0 0 32px #0008,0 0 28px #22d3ee12}
    .boardWrap{position:relative;display:grid;place-items:center;padding:10px;overflow:hidden}
    .board{--n:11;width:min(100%,calc(100vh - 78px));max-width:860px;aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;padding:7px;border:3px solid #facc15;border-radius:16px;background:linear-gradient(135deg,#0f2d2f,#11213b);box-shadow:0 22px 60px #000b,0 0 34px #facc1524}
    .cell{position:relative;min-width:0;min-height:0;border:1px solid #ffffff20;border-radius:7px;background:#0b1524;padding:4px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
    .cell>*:not(.ownerBg):not(.cellBubble){position:relative;z-index:2}.ownerBg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.18;filter:saturate(1.2) contrast(1.08);pointer-events:none}.ownerBg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07111f44,#07111fcc)}
    .cell.corner{background:linear-gradient(135deg,#facc15,#d97706);color:#1f1300}.cell.tax{background:#42151b}.cell.chance{background:#34205f}.cell.jail{background:#3b2a18}.cell.goto{background:#4c1111}
    .stripe{height:7px;border-radius:4px;margin:-1px -1px 2px}.name{font-size:clamp(7px,1vw,10px);font-weight:1000;line-height:1.1;text-transform:uppercase}.price{font-size:clamp(7px,.9vw,9px);color:#cbd5e1}.cell.corner .price{color:#3b2500}
    .owner{position:absolute;right:3px;bottom:3px;width:10px;height:10px;border-radius:50%;border:1px solid #fff8}.tokens{position:absolute;left:3px;bottom:3px;display:flex;gap:2px;flex-wrap:wrap;max-width:86%}
    .token,.movingToken{width:var(--token-size,24px);height:var(--token-size,24px);border-radius:50%;border:2px solid #fff;background:var(--p,#22d3ee);background-size:cover!important;background-position:center!important;box-shadow:0 3px 9px #000c,0 0 14px var(--p,#22d3ee),inset 0 0 0 1px #0006}.movingToken{position:absolute;z-index:40;pointer-events:none;transition:left .24s cubic-bezier(.2,1.5,.45,1),top .24s cubic-bezier(.2,1.5,.45,1);animation:tokenHop .24s ease-in-out infinite alternate}.center{grid-column:2/11;grid-row:2/11;border:1px solid #22d3ee33;border-radius:16px;background:radial-gradient(circle at 50% 30%,#12365e,#07111f 62%);display:grid;place-items:center;text-align:center;padding:18px;box-shadow:inset 0 0 40px #0008}
    .center h1{margin:0;color:#facc15;font-size:clamp(24px,4vw,46px);text-shadow:0 0 24px #facc1555}.center p{margin:8px 0 0;color:#cbd5e1;font-size:12px;line-height:1.5}.dicePanel{position:relative;margin:14px auto 0;min-height:120px;display:flex;align-items:center;justify-content:center;gap:34px;padding:14px 72px 14px 20px;border-radius:14px;background:linear-gradient(135deg,#2b3140,#161b28);box-shadow:inset 0 0 24px #0007,0 14px 30px #0008}.dice{display:flex;justify-content:center;gap:34px}.die{--rx:-22deg;--ry:0deg;position:relative;width:66px;height:66px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(-45deg);display:grid;place-items:center;color:#ecfeff;font-size:28px;font-weight:1000;text-shadow:0 2px 0 #075985,0 0 12px #22d3ee;filter:drop-shadow(0 16px 12px #0008)}
    .die:before,.die:after{content:"";position:absolute;inset:0;border-radius:2px}.die:before{background:linear-gradient(135deg,#22d3ee,#0891b2);transform:translateZ(22px);box-shadow:inset 0 -18px 22px #0891b2,0 0 18px #22d3ee55}.die:after{background:#075985;transform:rotateX(90deg) translateZ(-22px);filter:brightness(.8)}
    .die .value{position:relative;z-index:2;opacity:1;transform:rotateZ(45deg);line-height:1}.die.rolling .value{opacity:0}.die.rolling{animation:diceRoll3d .72s cubic-bezier(.16,.8,.24,1.08) infinite}.die:nth-child(2){--rx:-14deg;--ry:18deg}.diceTotal{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:7px;border-radius:8px;background:#111827d9;padding:6px 9px;box-shadow:0 8px 18px #0008;color:#fff}.diceTotal span{font-size:13px;font-weight:1000}.diceTotal b{font-size:30px;line-height:.9}
    .cell.spark{animation:landGlow 1s ease-out both}.cell.spark:before,.cell.spark:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#facc15;box-shadow:22px 0 #22d3ee,-22px 0 #fb7185,0 22px #34d399,0 -22px #facc15,16px 16px #f97316,-16px -16px #c084fc,18px -14px #fff,-18px 14px #fff;z-index:10;animation:sparkBurst .78s ease-out both}.cell.spark:after{transform:rotate(45deg);animation-delay:.08s}.cellBubble{position:absolute;left:50%;bottom:calc(100% + 6px);z-index:60;width:max-content;max-width:170px;transform:translateX(-50%);border:1px solid #facc15;border-radius:10px;background:#07111ff2;padding:7px 9px;color:#fff;box-shadow:0 10px 28px #000c,0 0 16px #facc1533;pointer-events:none;animation:bubblePop .25s ease-out both}.cellBubble b{display:block;color:#facc15;font-size:10px;line-height:1.1;text-transform:uppercase}.cellBubble span{display:block;margin-top:3px;color:#cbd5e1;font-size:9px;line-height:1.25}.cellBubble:after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:#07111ff2;border-right:1px solid #facc15;border-bottom:1px solid #facc15;transform:translate(-50%,-5px) rotate(45deg)}
    .side{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:12px;overflow:hidden}.panel{border:1px solid #22d3ee26;border-radius:12px;background:#061a2c;padding:10px}.panel h2{margin:0 0 8px;color:#facc15;font-size:13px;text-transform:uppercase}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button.wide{grid-column:1/-1}
    .auctionOverlay,.tradeOverlay{position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92%);border:2px solid #facc15;border-radius:16px;background:#07111ff2;padding:16px;box-shadow:0 24px 60px #000d,0 0 30px #facc1533;text-align:center}.auctionOverlay.hidden,.tradeOverlay.hidden{display:none}.auctionOverlay h3,.tradeOverlay h3{margin:0;color:#facc15;font-size:18px}.auctionOverlay p,.tradeOverlay p{color:#cbd5e1;font-size:12px}.auctionActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.auctionActions button{min-height:38px}.auctionBid{font-size:26px;color:#22c55e;font-weight:1000}.tradeMenu{position:fixed;z-index:500;border:1px solid #22d3ee55;border-radius:8px;background:#050914;padding:6px;box-shadow:0 18px 38px #000b}.tradeMenu.hidden{display:none}.tradeMenu button{width:130px;text-align:left}
    .assets{min-height:0;overflow:auto;display:grid;gap:8px;padding-right:3px}.assetPlayer{border:1px solid #ffffff14;border-radius:10px;background:#0b1320;padding:8px}.assetHead{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.assetPlayer.active{border-color:#facc15;box-shadow:0 0 18px #facc1522}.avatar{width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--p,#22d3ee);background-size:cover!important;background-position:center!important}.assetPlayer b{font-size:12px}.assetPlayer small{display:block;color:#cbd5e1;font-size:11px}.deeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:7px;margin-top:10px}.deed{position:relative;min-height:64px;border:1px solid #ffffff1c;border-radius:8px;background:linear-gradient(180deg,#101b2d,#07111f);padding:18px 7px 6px;font-size:9px;color:#e5e7eb;box-shadow:inset 0 0 16px #0007,0 8px 18px #0004;overflow:hidden}.deed i{position:absolute;left:0;right:0;top:0;height:13px;box-shadow:0 3px 10px #0007}.deed b{display:block;font-size:9px;line-height:1.1;text-transform:uppercase}.deed span{display:block;margin-top:5px;color:#cbd5e1;font-size:8px}.deed em{position:absolute;right:6px;bottom:5px;color:#facc15;font-style:normal;font-size:8px}.emptyDeeds{margin-top:10px;border:1px dashed #365273;border-radius:8px;background:#07111f99;padding:10px;color:#64748b;font-size:10px;text-align:center}.log{min-height:72px;max-height:120px;overflow:auto;color:#cbd5e1;font-size:12px;line-height:1.5}.hint{color:#9ca3af;font-size:11px;line-height:1.45;margin:0}
    @media(max-width:900px){html,body{overflow:auto}.layout{grid-template-columns:1fr}.board{width:min(100%,92vw)}.side{min-height:520px}.top{flex-wrap:wrap}.status{margin-left:0;width:100%;text-align:left}}
    @media(max-width:560px){.layout{padding:8px}.board{gap:2px;padding:4px}.cell{border-radius:4px;padding:2px}.name{font-size:6px}.price{display:none}.board{--token-size:16px!important}.center{padding:8px}.center p{display:none}.dicePanel{min-height:86px;gap:16px;padding:10px 58px 10px 10px}.dice{gap:18px}.die{width:46px;height:46px;font-size:20px}.diceTotal b{font-size:22px}.actions{grid-template-columns:1fr}}
    @keyframes diceRoll3d{0%{transform:rotateX(-22deg) rotateY(0) rotateZ(-45deg) scale(1)}30%{transform:rotateX(135deg) rotateY(160deg) rotateZ(24deg) scale(1.08)}65%{transform:rotateX(300deg) rotateY(320deg) rotateZ(-18deg) scale(.95)}100%{transform:rotateX(520deg) rotateY(540deg) rotateZ(-45deg) scale(1)}}
    @keyframes tokenHop{from{transform:translateY(0) scale(1)}to{transform:translateY(-13px) scale(1.08)}}
    @keyframes sparkBurst{from{opacity:1;transform:translate(-50%,-50%) scale(.18)}to{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
    @keyframes landGlow{0%{box-shadow:0 0 0 0 #facc1500,0 0 0 #22d3ee00}35%{box-shadow:0 0 0 5px #facc1544,0 0 28px #22d3ee66}100%{box-shadow:0 0 0 16px #facc1500,0 0 0 #22d3ee00}}
    @keyframes bubblePop{from{opacity:0;transform:translate(-50%,8px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">MONOPOLIO ARCADE</div>
    <div class="roomControls">
      <button id="create">Crear</button>
      <input id="room" placeholder="Codigo" />
      <button id="join">Unirse</button>
    </div>
    <span id="status" class="status">Conectando...</span>
  </header>
  <main class="layout">
    <section class="boardWrap">
      <div id="board" class="board"></div>
    </section>
    <aside class="side">
      <section class="panel">
        <h2>Sala</h2>
        <p class="hint" id="roomInfo">Crea una sala. Se juega entre 2 y 8 jugadores.</p>
      </section>
      <section class="panel">
        <h2>Turno</h2>
        <div class="actions">
          <button id="start" class="wide">Iniciar partida</button>
          <button id="roll">Lanzar dados</button>
          <button id="buy">Comprar</button>
          <button id="auction">Subastar</button>
          <button id="build">Construir</button>
          <button id="mortgage">Hipotecar</button>
          <button id="end">Terminar turno</button>
        </div>
      </section>
      <section class="assets" id="assets"></section>
      <section class="panel">
        <h2>Registro</h2>
        <div id="log" class="log">Esperando sala...</div>
      </section>
    </aside>
    <section id="auctionOverlay" class="auctionOverlay hidden">
      <h3 id="auctionTitle">Subasta</h3>
      <p id="auctionText">La propiedad se adjudica al mejor postor.</p>
      <div class="auctionBid" id="auctionBid">$0</div>
      <p id="auctionLeader">Sin pujas.</p>
      <div class="auctionActions">
        <button id="bid10">+10</button>
        <button id="bid50">+50</button>
        <button id="passAuction">Pasar</button>
      </div>
    </section>
    <section id="tradeOverlay" class="tradeOverlay hidden">
      <h3>Trueque</h3>
      <p id="tradeText">Selecciona un jugador desde el marcador con click derecho para iniciar.</p>
      <button id="closeTrade">Cerrar</button>
    </section>
  </main>
  <script src="/games/realtime-room.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    document.body.classList.toggle("embedded", params.get("embed") === "1");
    const profile = { userId: params.get("userId") || "", displayName: params.get("displayName") || "Jugador", avatarUrl: params.get("avatarUrl") || "" };
    const preset = (params.get("room") || "").toUpperCase();
    const hostParam = params.get("host") === "1";
    const $ = (id) => document.getElementById(id);
    const colors = ["#22d3ee","#facc15","#fb7185","#34d399","#c084fc","#f97316","#a3e635","#f472b6"];
    const groupMeta = {
      brown:{ color:"#8b5a2b", house:50 }, lightblue:{ color:"#22d3ee", house:50 }, pink:{ color:"#ec4899", house:100 }, orange:{ color:"#f97316", house:100 },
      red:{ color:"#ef4444", house:150 }, yellow:{ color:"#facc15", house:150 }, green:{ color:"#22c55e", house:200 }, blue:{ color:"#3b82f6", house:200 }
    };
    const boardCells = [
      { name:"Salida", type:"start" },
      { name:"Mediterraneo", type:"property", group:"brown", price:60, rents:[2,10,30,90,160,250] },{ name:"Arca Comunal", type:"chest" },{ name:"Baltic", type:"property", group:"brown", price:60, rents:[4,20,60,180,320,450] },{ name:"Impuesto Renta", type:"tax", amount:200 },{ name:"Estacion Lectura", type:"railroad", price:200 },
      { name:"Oriental", type:"property", group:"lightblue", price:100, rents:[6,30,90,270,400,550] },{ name:"Suerte", type:"chance" },{ name:"Vermont", type:"property", group:"lightblue", price:100, rents:[6,30,90,270,400,550] },{ name:"Connecticut", type:"property", group:"lightblue", price:120, rents:[8,40,100,300,450,600] },
      { name:"Carcel / Visita", type:"jail" },
      { name:"St. Charles", type:"property", group:"pink", price:140, rents:[10,50,150,450,625,750] },{ name:"Electricidad", type:"utility", price:150 },{ name:"States", type:"property", group:"pink", price:140, rents:[10,50,150,450,625,750] },{ name:"Virginia", type:"property", group:"pink", price:160, rents:[12,60,180,500,700,900] },{ name:"Estacion Penn", type:"railroad", price:200 },
      { name:"St. James", type:"property", group:"orange", price:180, rents:[14,70,200,550,750,950] },{ name:"Arca Comunal", type:"chest" },{ name:"Tennessee", type:"property", group:"orange", price:180, rents:[14,70,200,550,750,950] },{ name:"New York", type:"property", group:"orange", price:200, rents:[16,80,220,600,800,1000] },
      { name:"Parking Libre", type:"free" },
      { name:"Kentucky", type:"property", group:"red", price:220, rents:[18,90,250,700,875,1050] },{ name:"Suerte", type:"chance" },{ name:"Indiana", type:"property", group:"red", price:220, rents:[18,90,250,700,875,1050] },{ name:"Illinois", type:"property", group:"red", price:240, rents:[20,100,300,750,925,1100] },{ name:"B&O Rail", type:"railroad", price:200 },
      { name:"Atlantic", type:"property", group:"yellow", price:260, rents:[22,110,330,800,975,1150] },{ name:"Ventnor", type:"property", group:"yellow", price:260, rents:[22,110,330,800,975,1150] },{ name:"Agua", type:"utility", price:150 },{ name:"Marvin Gardens", type:"property", group:"yellow", price:280, rents:[24,120,360,850,1025,1200] },
      { name:"Ir a Carcel", type:"goto" },
      { name:"Pacific", type:"property", group:"green", price:300, rents:[26,130,390,900,1100,1275] },{ name:"North Carolina", type:"property", group:"green", price:300, rents:[26,130,390,900,1100,1275] },{ name:"Arca Comunal", type:"chest" },{ name:"Pennsylvania", type:"property", group:"green", price:320, rents:[28,150,450,1000,1200,1400] },{ name:"Short Line", type:"railroad", price:200 },
      { name:"Suerte", type:"chance" },{ name:"Park Place", type:"property", group:"blue", price:350, rents:[35,175,500,1100,1300,1500] },{ name:"Impuesto Lujo", type:"tax", amount:100 },{ name:"Boardwalk", type:"property", group:"blue", price:400, rents:[50,200,600,1400,1700,2000] }
    ];
    const positions = Array.from({ length: 40 }, (_, index) => {
      if (index <= 10) return [10, 10 - index];
      if (index <= 20) return [20 - index, 0];
      if (index <= 30) return [0, index - 20];
      return [index - 30, 10];
    });
    let api, connected = false, peers = [], isHost = hostParam, rolledThisTurn = false, diceRolling = false;
    const hiddenMovingIds = new Set();
    let state = { phase:"lobby", players:[], turn:0, dice:[1,1], lastRoll:0, doubles:0, extraRollFor:null, log:["Esperando jugadores."], owners:{}, buildings:{}, mortgages:{}, houses:32, hotels:12, chanceDeck:[], chestDeck:[], auction:null, trade:null, ended:false };
    if (preset) $("room").value = preset;

    function key(){ return profile.userId || api?.playerId || "local"; }
    function fmt(n){ return Number(n || 0).toLocaleString("es-CL"); }
    function pushLog(text){ state.log.unshift(text); state.log = state.log.slice(0, 18); }
    function localPlayer(){ return state.players.find((p) => p.id === key()); }
    function currentPlayer(){ return state.players[state.turn % Math.max(1, state.players.length)]; }
    function currentCell(player = currentPlayer()){ return boardCells[player?.pos || 0]; }
    function isOwnable(cell){ return ["property","railroad","utility"].includes(cell?.type); }
    function groupColor(cell){ return cell?.group ? groupMeta[cell.group]?.color : cell?.type === "railroad" ? "#94a3b8" : cell?.type === "utility" ? "#06b6d4" : ""; }
    function groupIndexes(group){ if (!group) return []; return boardCells.map((cell, idx) => cell.group === group ? idx : -1).filter((idx) => idx >= 0); }
    function propertyIndexesOf(id){ return Object.entries(state.owners).filter(([,owner]) => owner === id).map(([idx]) => Number(idx)); }
    function netWorth(player){ return Number(player.money || 0) + propertyIndexesOf(player.id).reduce((sum, idx) => sum + Math.floor((boardCells[idx].price || 0) * .7), 0); }
    function ownsGroup(playerId, group){ const indexes = groupIndexes(group); return indexes.length > 0 && indexes.every((idx) => state.owners[idx] === playerId); }
    function ownedOfType(playerId, type){ return propertyIndexesOf(playerId).filter((idx) => boardCells[idx].type === type).length; }
    function buildingCount(idx){ return Number(state.buildings[idx] || 0); }
    function isMortgaged(idx){ return Boolean(state.mortgages[idx]); }
    function rentAmount(idx, diceTotal = state.lastRoll || 0){
      const cell = boardCells[idx];
      const ownerId = state.owners[idx];
      if (!cell || !ownerId || isMortgaged(idx)) return 0;
      if (cell.type === "railroad") return [0,25,50,100,200][ownedOfType(ownerId, "railroad")] || 25;
      if (cell.type === "utility") return diceTotal * (ownedOfType(ownerId, "utility") >= 2 ? 10 : 4);
      const built = buildingCount(idx);
      let rent = cell.rents?.[built] || cell.rents?.[0] || 0;
      if (!built && cell.group && ownsGroup(ownerId, cell.group)) rent *= 2;
      return rent;
    }
    function rentLabel(idx){ return `Renta $${fmt(rentAmount(idx, 7))}`; }
    function sendState(){ api?.send("state", state); render(); }
    function applyState(next){ if (!next) return; state = { ...state, ...next }; render(); }
    function setStatus(text){ $("status").innerHTML = connected ? `<span class="roomBadge">${text}</span>` : text; }
    function tokenBg(player){
      return player?.avatarUrl ? `url('${String(player.avatarUrl).replace(/'/g, "%27")}') center/cover` : player?.color || "#22d3ee";
    }
    function propertyPayload(idx){
      const cell = boardCells[idx];
      return {
        id: String(idx),
        name: cell.name,
        price: Number(cell.price || 0),
        rent: rentAmount(idx, state.lastRoll || 7),
        color: groupColor(cell) || "#22d3ee",
        mortgaged: isMortgaged(idx),
        buildings: buildingCount(idx),
      };
    }
    function tokenSize(){
      const count = Math.max(1, state.players.filter((p) => !p.bankrupt).length);
      if (count <= 2) return 32;
      if (count <= 4) return 28;
      if (count <= 6) return 24;
      return 21;
    }
    function publishScoreboard(){
      const current = currentPlayer();
      window.parent?.postMessage({
        type: "game:updateLeaderboard",
        players: state.players.map((p) => {
          const props = propertyIndexesOf(p.id);
          const ownedProperties = props.map(propertyPayload);
          return {
            userId: p.id,
            playerId: p.playerId || p.id,
            name: p.name || "Jugador",
            avatarUrl: p.avatarUrl || "",
            score: Math.max(0, Number(p.money || 0)),

      const idx = propertyIndexesOf(mine.id).find((i) => {
        const cell = boardCells[i];
        if (cell.type !== "property" || !ownsGroup(mine.id, cell.group) || isMortgaged(i)) return false;
        const group = groupIndexes(cell.group);
        const built = buildingCount(i);
        const minBuilt = Math.min(...group.map((g)=>buildingCount(g)));
        return built < 5 && built === minBuilt && mine.money >= (groupMeta[cell.group]?.house || 0);
      });
      if (idx === undefined) return;
      const cell = boardCells[idx];
      const cost = groupMeta[cell.group]?.house || 0;
      const built = buildingCount(idx);
      if (built === 4) {
        if (state.hotels <= 0) return;
        state.hotels -= 1; state.houses += 4; state.buildings[idx] = 5;
      } else {
        if (state.houses <= 0) return;
        state.houses -= 1; state.buildings[idx] = built + 1;
      }
      mine.money -= cost;
      pushLog(`${mine.name} construyo en ${cell.name} por $${fmt(cost)}.`);
      sendState();
    }
    function mortgageFirstAvailable(){
      const mine = localPlayer();
      if (!mine) return;
      const idx = propertyIndexesOf(mine.id).find((i) => !isMortgaged(i) && !groupIndexes(boardCells[i].group).some((g)=>buildingCount(g)>0));
      if (idx === undefined) return;
      state.mortgages[idx] = true;
      mine.money += Math.floor((boardCells[idx].price || 0) / 2);
      pushLog(`${mine.name} hipoteco ${boardCells[idx].name}.`);
      sendState();
    }
    function endTurn(){
      if (!rolledThisTurn) return;
      const mine = localPlayer();
      if (mine && state.extraRollFor === mine.id) {
        state.extraRollFor = null;
        rolledThisTurn = false;
        pushLog(`${mine.name} repite turno por dobles.`);
        sendState();
        return;
      }
      let next = state.turn + 1;
      for (let i = 0; i < state.players.length; i++) {
        const candidate = state.players[next % state.players.length];
        if (!candidate.bankrupt) break;
        next++;
      }
      state.turn = next % state.players.length;
      currentPlayer().doubles = 0;
      rolledThisTurn = false;
      sendState();
    }
    async function connect(room){
      const code = String(room || "").trim().toUpperCase();
      if (!code) return;
      await api.connect(code);
      connected = true;
      $("room").value = code;
      setStatus(`Sala ${code}`);
      api.send("state_request", { userId: profile.userId, playerId: api.playerId });
      if (isHost) syncPlayersFromPresence();
      render();
    }
    async function setup(){
      render();
      try {
        api = await createRealtimeRoom({
          game: "monopoly",
          profile,
          maxPlayers: 8,
          onPeers: (count, list) => {
            peers = Array.isArray(list) ? list : peers;
            const leader = [...peers].sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0))[0];
            isHost = hostParam || Boolean(leader && (leader.userId === profile.userId || leader.playerId === api?.playerId));
            setStatus(connected ? `Sala ${api.room}` : "Listo");
            syncPlayersFromPresence();
            render();
          },
          onMessage: (message) => {
            if (message.type === "state_request" && isHost) api.send("state", state);
            if (message.type === "state") applyState(message.payload);
            if (message.type === "roll_fx") playRollFx(message.payload);
            if (message.type === "win") pushLog(`${message.payload.displayName || "Jugador"} guardo puntos de victoria.`);
          }
        });
        setStatus("Listo");
        if (preset) connect(preset);
      } catch (error) {
        setStatus(error.message || "Sin realtime");
      }
    }
    $("create").onclick = () => connect($("room").value || Math.random().toString(36).slice(2,8).toUpperCase());
    $("join").onclick = () => connect($("room").value);
    $("start").onclick = startGame;
    $("roll").onclick = rollDice;
    $("buy").onclick = buyProperty;
    $("auction").onclick = () => startAuction();
    $("build").onclick = buildOnFirstAvailable;
    $("mortgage").onclick = mortgageFirstAvailable;
    $("end").onclick = endTurn;
    $("bid10").onclick = () => bidAuction(10);
    $("bid50").onclick = () => bidAuction(50);
    $("passAuction").onclick = passAuction;
    $("closeTrade").onclick = () => $("tradeOverlay").classList.add("hidden");
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "monopoly:tradeRequest") return;
      const mine = localPlayer();
      if (!mine || currentPlayer()?.id !== mine.id) return;
      const targetName = event.data.targetName || "jugador";
      $("tradeText").textContent = `Trueque solicitado con ${targetName}. Puedes intercambiar dinero, propiedades sin construcciones y tarjetas de carcel en la siguiente version del panel.`;
      $("tradeOverlay").classList.remove("hidden");
      pushLog(`${mine.name} abrio trueque con ${targetName}.`);
      render();
    });
    setup();
  </script>
</body>
