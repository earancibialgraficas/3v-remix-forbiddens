<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Carrera de Caballos</title><style>html,body{height:100%;margin:0;background:#071014;color:#fff;font-family:Inter,Arial;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{min-height:32px;border:1px solid #334155;border-radius:8px;background:#111827;color:#fff;padding:7px 10px}button{background:#92400e;border-color:#facc15;font-weight:900}.status{margin-left:auto;color:#67e8f9}.track{border:2px solid #d6b16f;border-radius:14px;background:#24451f;padding:12px;display:grid;grid-template-rows:repeat(5,1fr);gap:8px}.lane{position:relative;border-bottom:2px dashed #ffffff66}.horse{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:42px;transition:left 3s cubic-bezier(.12,.8,.18,1)}.finish{position:absolute;right:32px;top:0;bottom:0;border-left:6px dashed #ef4444}.log{font-size:12px;color:#cbd5e1}@media(max-width:560px){.status{margin-left:0}.horse{font-size:32px}}</style></head><body><div class="bar"><button id="create">Crear</button><input id="room" placeholder="Codigo"/><button id="join">Unirse</button><input id="bet" type="number" value="25" min="1"/><select id="pick"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><button id="race">Correr</button><span id="status" class="status">Conectando...</span></div><main class="track" id="track"><div class="finish"></div></main><p id="log" class="log">Elige caballo y apuesta puntos.</p><script src="/games/realtime-room.js"></script><script>
const p=new URLSearchParams(location.search),profile={userId:p.get('userId')||'',displayName:p.get('displayName')||'Jugador',avatarUrl:p.get('avatarUrl')||''};let api,connected=false;const roomEl=room,statusEl=status,preset=(p.get('room')||'').toUpperCase();if(preset)roomEl.value=preset;track.innerHTML='<div class="finish"></div>'+Array.from({length:5},(_,i)=>`<div class="lane"><span class="horse" id="h${i+1}">♞</span></div>`).join('');async function connect(r){await api.connect(r);connected=true;roomEl.value=r;statusEl.textContent='Sala '+r}async function run(local,winner){winner=winner||Math.ceil(Math.random()*5);for(let i=1;i<=5;i++){document.getElementById('h'+i).style.left=(i===winner?86:Math.floor(Math.random()*68)+8)+'%'}const bet=Number(document.getElementById('bet').value)||1,chosen=Number(pick.value),win=chosen===winner,payout=win?bet*5:0;log.textContent=`Gano caballo ${winner}. ${win?'Cobraste':'Perdiste'} ${payout} pts.`;if(!local){api.send('race',{winner});const r=await api.casinoWager('casino-horses',bet,payout,{chosen,winner});if(r.reason&&r.awarded===0)log.textContent+=' Wallet pendiente: '+r.reason}}async function setup(){try{api=await createRealtimeRoom({game:'casino-horses',profile,onMessage:m=>{if(m.type==='race')run(true,m.payload.winner)}});statusEl.textContent='Listo';if(preset)connect(preset)}catch(e){statusEl.textContent=e.message||'Sin realtime'}}create.onclick=()=>connect(roomEl.value.trim().toUpperCase()||Math.random().toString(36).slice(2,8).toUpperCase());join.onclick=()=>connect(roomEl.value.trim().toUpperCase());race.onclick=()=>run(false);setup();
</script></body></html>
