<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrera de Caballos</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#071014;color:#fff;font-family:Inter,Arial;overflow:hidden}
    body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:10px}
    .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{min-height:32px;border:1px solid #334155;border-radius:8px;background:#111827;color:#fff;padding:7px 10px;font-size:12px}button{background:#92400e;border-color:#facc15;font-weight:900;cursor:pointer}.status{margin-left:auto;color:#67e8f9}
    .track{position:relative;border:2px solid #d6b16f;border-radius:14px;background:#24451f;padding:12px;display:grid;grid-template-rows:repeat(5,1fr);gap:8px;min-height:0;overflow:hidden}.lane{position:relative;border-bottom:2px dashed #ffffff66}.lane::before{content:attr(data-lane);position:absolute;left:6px;top:8px;color:#facc15;font-weight:900}.horse{position:absolute;left:42px;top:50%;transform:translateY(-50%);font-size:42px;transition:left 3.4s cubic-bezier(.12,.8,.18,1);filter:drop-shadow(0 4px 0 #0008)}.finish{position:absolute;right:32px;top:0;bottom:0;border-left:6px dashed #ef4444;z-index:2}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.log{font-size:12px;color:#cbd5e1}.pot{border:1px solid #facc1540;background:#facc1510;border-radius:10px;padding:8px 12px;color:#facc15;font-weight:900}
    @media(max-width:560px){.status{margin-left:0}.horse{font-size:32px}.bar{display:grid;grid-template-columns:1fr 1fr}.status{grid-column:1/-1;text-align:center}.hud{grid-template-columns:1fr}.pot{width:max-content}}
  </style>
</head>
<body>
  <div class="bar">
    <button id="create">Crear</button><input id="room" placeholder="Codigo"/><button id="join">Unirse</button>
    <input id="bet" type="number" value="25" min="1"/><select id="pick"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button id="race">Correr manual</button><span id="status" class="status">Conectando...</span>
  </div>
  <main class="track" id="track"><div class="finish"></div></main>
  <div class="hud"><p id="log" class="log">La carrera inicia automaticamente cuando hay minimo 3 personas en la sala. El pozo usa F-coin apostada + 10% de la casa.</p><div class="pot">Pozo: <span id="pot">0</span> F-coin</div></div>
  <script src="/games/realtime-room.js"></script>
  <script>
    const p=new URLSearchParams(location.search),profile={userId:p.get('userId')||'',displayName:p.get('displayName')||'Jugador',avatarUrl:p.get('avatarUrl')||''},shouldHost=p.get('host')==='1';
    let api,connected=false,running=false,lastCount=0,autoTimer=0,bets={};const roomEl=room,statusEl=status,preset=(p.get('room')||'').toUpperCase();if(preset)roomEl.value=preset;
    track.innerHTML='<div class="finish"></div>'+Array.from({length:5},(_,i)=>`<div class="lane" data-lane="${i+1}"><span class="horse" id="h${i+1}">&#9822;</span></div>`).join('');
    function localBet(){return{userId:profile.userId||api?.playerId||'local',name:profile.displayName,bet:Math.max(1,Number(document.getElementById('bet').value)||1),pick:Number(pick.value)}}
    function updatePot(){const mine=localBet();bets[mine.userId]=mine;const total=Object.values(bets).reduce((s,b)=>s+Number(b.bet||0),0);pot.textContent=total.toLocaleString();return total}
    function broadcastBet(){const b=localBet();bets[b.userId]=b;updatePot();api?.send('bet',b)}
    async function connect(r){await api.connect(r);connected=true;roomEl.value=r;statusEl.textContent='Sala '+r;broadcastBet()}
    function resetTrack(){for(let i=1;i<=5;i++)document.getElementById('h'+i).style.left='42px'}
    async function run(local,winner){if(running&&!local)return;running=true;winner=winner||Math.ceil(Math.random()*5);resetTrack();setTimeout(()=>{for(let i=1;i<=5;i++)document.getElementById('h'+i).style.left=(i===winner?86:Math.floor(Math.random()*68)+10)+'%'},60);const totalPot=updatePot(),mine=localBet(),win=mine.pick===winner,payout=win?Math.floor(totalPot*1.1):0;log.textContent=`Gano caballo ${winner}. ${win?'Cobraste':'Perdiste'} ${payout} F-coin. Pozo ${totalPot}.`;if(!local)api.send('race',{winner});const r=await api.casinoWager('casino-horses',mine.bet,payout,{chosen:mine.pick,winner,pot:totalPot,players:lastCount,houseBonus:0.1});if(r.reason&&r.awarded===0)log.textContent+=' Wallet pendiente: '+r.reason;setTimeout(()=>{running=false;resetTrack();if(shouldHost&&lastCount>=3)scheduleAuto()},4600)}
    function scheduleAuto(){if(autoTimer||running)return;log.textContent='3+ jugadores conectados. Carrera automatica en 8 segundos...';autoTimer=setTimeout(()=>{autoTimer=0;if(shouldHost&&lastCount>=3)run(false)},8000)}
    async function setup(){try{api=await createRealtimeRoom({game:'casino-horses',profile,onPeers:(count)=>{lastCount=count;statusEl.textContent=`${count} en sala`;if(shouldHost&&count>=3)scheduleAuto()},onMessage:m=>{if(m.type==='race')run(true,m.payload.winner);if(m.type==='bet'){bets[m.payload.userId||m.payload.name]=m.payload;updatePot()}}});statusEl.textContent='Listo';if(preset)connect(preset)}catch(e){statusEl.textContent=e.message||'Sin realtime'}}
    create.onclick=()=>connect(roomEl.value.trim().toUpperCase()||Math.random().toString(36).slice(2,8).toUpperCase());join.onclick=()=>connect(roomEl.value.trim().toUpperCase());race.onclick=()=>run(false);bet.onchange=broadcastBet;pick.onchange=broadcastBet;setup();
  </script>
</body>
</html>
