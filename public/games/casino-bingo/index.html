<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bingo BET</title>
  <style>
    *{box-sizing:border-box;scrollbar-color:#facc15 #08111f;scrollbar-width:thin}
    html,body{height:100%;margin:0;background:#07111f;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:#08111f;border-left:1px solid #1d3552}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#facc15,#22d3ee);border:2px solid #08111f;border-radius:999px;box-shadow:0 0 12px #22d3ee66}
    body{display:grid;grid-template-rows:auto auto minmax(0,1fr);background:radial-gradient(circle at 50% -10%,#15467a 0,#07111f 50%,#030712 100%)}
    button,input,select{min-height:32px;border:1px solid #33506f;border-radius:8px;background:#0e1b2d;color:#fff;padding:6px 10px;font-size:12px;box-shadow:inset 0 0 12px #0008}
    button{cursor:pointer;border-color:#facc15;background:linear-gradient(#23334f,#111827);font-weight:1000;box-shadow:0 2px 0 #8a5b00,0 0 14px #facc152d}
    button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
    .top{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 10px;background:#050914d9;border-bottom:1px solid #facc1526}
    .brand{font-weight:1000;color:#facc15;text-shadow:0 0 14px #facc1544;white-space:nowrap}
    .roomControls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .roomControls input{text-transform:uppercase;width:108px}
    .status{margin-left:auto;color:#cbd5e1;font-size:12px;text-align:right}
    .calledLine{display:flex;gap:6px;align-items:center;min-height:50px;padding:7px 10px;overflow-x:auto;background:linear-gradient(90deg,#08111f,#0b1e34,#08111f);border-bottom:1px solid #22d3ee24}
    .calledLabel{position:sticky;left:0;z-index:1;background:#08111f;color:#facc15;font-weight:1000;font-size:12px;padding-right:8px}
    .ballMini{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 18%,#facc15 19% 58%,#b45309 59%);color:#311400;font-size:12px;font-weight:1000;border:2px solid #fff7;box-shadow:0 5px 12px #0008,0 0 14px #facc1545}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(250px,360px) minmax(0,1fr);gap:12px;padding:12px}
    .left,.right{min-height:0;border:1px solid #facc152b;background:#07111fd9;border-radius:14px;box-shadow:inset 0 0 32px #0008,0 0 28px #22d3ee12}
    .left{display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}
    .phase{border:1px solid #22d3ee40;border-radius:12px;background:#061a2c;padding:10px;text-align:center}
    .phase b{display:block;color:#facc15;font-size:18px;text-transform:uppercase;text-shadow:0 0 14px #facc1555}
    .phase span{font-size:12px;color:#cbd5e1}
    .tombola{position:relative;display:grid;place-items:center;min-height:260px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#193b64 0,#061526 64%,#02050a 65%);border:8px solid #144364;box-shadow:inset 0 0 40px #22d3ee35,0 20px 40px #000a,0 0 28px #22d3ee20;overflow:hidden}
    .tombola:before{content:"";position:absolute;inset:26px;border-radius:50%;border:2px dashed #facc1555;animation:spin 8s linear infinite}
    .tombola.playing:before{animation-duration:1.8s}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bigBall{position:relative;z-index:2;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#fff 0 17%,#facc15 18% 58%,#b45309 59% 100%);border:5px solid #fff9;color:#361600;font-size:42px;font-weight:1000;box-shadow:0 18px 30px #000a,0 0 34px #facc1566;transition:transform .45s ease}
    .bigBall.pop{animation:popBall .7s ease}
    @keyframes popBall{0%{transform:translateY(-60px) scale(.5);opacity:.2}70%{transform:translateY(6px) scale(1.08)}100%{transform:translateY(0) scale(1);opacity:1}}
    .controls{display:grid;gap:8px}
    .cardsPicker{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .wallet{font-size:12px;color:#cbd5e1}
    .right{display:grid;grid-template-rows:auto minmax(0,1fr);padding:10px}
    .rightHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 10px}
    .rightHead h2{margin:0;color:#fff;font-size:18px;text-shadow:0 0 18px #22d3ee44}
    .cards{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding-right:4px}
    .card{border:1px solid #22d3ee66;border-radius:10px;background:#eaf7ff;color:#172033;overflow:hidden;box-shadow:0 14px 28px #0008,0 0 18px #22d3ee25}
    .cardHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#4c1d95,#a21caf);color:#fff;padding:5px 8px;font-size:11px;font-weight:1000}
    .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;padding:6px;background:#b8c7d9}
    .cell{height:36px;display:grid;place-items:center;background:#fff;font-size:18px;font-weight:1000;color:#5b1025;border:1px solid #cad7e5;user-select:none}
    .cell.blank{background:#edf2f7;color:transparent}
    .cell.marked{background:#facc15;color:#2b1500;box-shadow:inset 0 0 0 3px #fff7,0 0 10px #facc1555}
    .cell.called:not(.marked){outline:3px solid #22d3ee;outline-offset:-4px}
    .toastStage{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:#02061788;backdrop-filter:blur(2px)}
    .toastStage.show{display:grid;animation:fade .9s ease both}
    .toastStage div{border:2px solid #facc15;border-radius:16px;background:#07111f;padding:22px 32px;text-align:center;box-shadow:0 0 40px #facc1544}
    .toastStage b{display:block;font-size:34px;color:#facc15;text-shadow:0 0 20px #facc1580;text-transform:uppercase}
    .toastStage span{color:#cbd5e1}
    @keyframes fade{0%,100%{opacity:0}15%,82%{opacity:1}}
    @media(max-width:860px){html,body{overflow:auto}.layout{grid-template-columns:1fr}.left{min-height:560px}.cards{grid-template-columns:1fr}.status{width:100%;margin-left:0;text-align:left}.top{flex-wrap:wrap}.brand{width:100%}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">BINGO BET</div>
    <div class="roomControls">
      <button id="create">Crear</button>
      <input id="room" placeholder="Codigo" />
      <button id="join">Unirse</button>
    </div>
    <span id="status" class="status">Conectando...</span>
  </header>

  <section class="calledLine" id="calledLine"><span class="calledLabel">Bolas</span></section>

  <main class="layout">
    <aside class="left">
      <div class="phase">
        <b id="phaseName">Esperando</b>
        <span id="phaseHelp">La partida empieza automaticamente en 1 minuto.</span>
      </div>
      <div class="tombola" id="tombola">
        <div class="bigBall" id="bigBall">--</div>
      </div>
      <div class="controls">
        <div class="cardsPicker">
          <select id="cardCount">
            <option value="1">1 carton</option>
            <option value="2">2 cartones (+500 F)</option>
            <option value="3">3 cartones (+1000 F)</option>
            <option value="4">4 cartones (+1500 F)</option>
          </select>
          <button id="applyCards">Usar</button>
        </div>
        <button id="claimLine">Cantar linea</button>
        <button id="claimTwo">Cantar 2 lineas</button>
        <button id="claimFull">Casa llena</button>
        <div class="wallet">Saldo F-coin: <b id="wallet">...</b></div>
        <div class="wallet" id="log">Crea o entra a una sala para jugar.</div>
      </div>
    </aside>

    <section class="right">
      <div class="rightHead">
        <h2>Cartones</h2>
        <span id="players">0 jugador(es)</span>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div class="toastStage" id="stageToast"><div><b id="stageTitle"></b><span id="stageText"></span></div></div>

  <script src="/games/realtime-room.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const profile = { userId: p.get("userId") || "", displayName: p.get("displayName") || "Jugador", avatarUrl: p.get("avatarUrl") || "" };
    const $ = (id) => document.getElementById(id);
    let api, connected = false, peers = [], isLeader = false, wallet = null;
    let cardsData = [], called = [], deck = [], roundActive = false, roomLocked = false, phase = "line";
    let autoTimer = null, drawTimer = null, countdown = 60, claimed = { line: false, two: false, full: false };
    const preset = (p.get("room") || "").toUpperCase();
    if (preset) $("room").value = preset;

    function fmt(n){ return Number(n || 0).toLocaleString("es-CL"); }
    function log(text){ $("log").textContent = text; }
    function speak(text){
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "es-ES"; u.rate = .92; u.pitch = 1.05;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch {}
    }
    function showStage(title, text){
      $("stageTitle").textContent = title;
      $("stageText").textContent = text;
      $("stageToast").classList.remove("show");
      void $("stageToast").offsetWidth;
      $("stageToast").classList.add("show");
      speak(`${title}. ${text}`);
    }
    function renderWallet(next){
      if (typeof next === "number") wallet = next;
      $("wallet").textContent = wallet === null ? "..." : fmt(wallet);
    }
    async function refreshWallet(){
      if (!api?.getWallet) return;
      const result = await api.getWallet();
      if (typeof result.balance === "number") renderWallet(result.balance);
    }
    function makeCard(){
      const rows = [[],[],[]];
      const used = new Set();
      for (let col = 0; col < 9; col++) {
        const min = col === 0 ? 1 : col * 10;
        const max = col === 8 ? 90 : col * 10 + 9;
        const colNums = [];
        while (colNums.length < 2) {
          const n = Math.floor(Math.random() * (max - min + 1)) + min;
          if (!used.has(n)) { used.add(n); colNums.push(n); }
        }
        const rowA = Math.floor(Math.random() * 3);
        let rowB = Math.floor(Math.random() * 3);
        while (rowB === rowA) rowB = Math.floor(Math.random() * 3);
        rows[rowA][col] = colNums[0];
        rows[rowB][col] = colNums[1];
      }
      rows.forEach((row) => {
        while (row.filter(Boolean).length > 5) {
          const filled = row.map((v, i) => v ? i : -1).filter((i) => i >= 0);
          row[filled[Math.floor(Math.random() * filled.length)]] = null;
        }
        while (row.filter(Boolean).length < 5) {
          const empty = row.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
          const col = empty[Math.floor(Math.random() * empty.length)];
          const min = col === 0 ? 1 : col * 10;
          const max = col === 8 ? 90 : col * 10 + 9;
          let n = Math.floor(Math.random() * (max - min + 1)) + min;
          while (used.has(n)) n = Math.floor(Math.random() * (max - min + 1)) + min;
          used.add(n); row[col] = n;
        }
      });
      return rows;
    }
    function renderCards(){
      $("cards").innerHTML = cardsData.map((cardRows, cardIndex) => `
        <article class="card">
          <div class="cardHead"><span>CARD ${cardIndex + 1}</span><span>${cardIndex === 0 ? "base" : "500 F"}</span></div>
          <div class="grid">
            ${cardRows.flatMap((row, rowIndex) => row.map((value, colIndex) => {
              const marked = value && called.includes(value);
              return `<button class="cell ${value ? "" : "blank"} ${marked ? "called" : ""}" data-card="${cardIndex}" data-row="${rowIndex}" data-col="${colIndex}" ${value ? "" : "disabled"}>${value || ""}</button>`;
            })).join("")}
          </div>
        </article>
      `).join("");
      document.querySelectorAll(".cell").forEach((cell) => {
        cell.onclick = () => {
          if (!cell.textContent) return;
          if (!called.includes(Number(cell.textContent))) return;
          cell.classList.toggle("marked");
        };
      });
    }
    function renderCalled(){
      $("calledLine").innerHTML = `<span class="calledLabel">Bolas</span>` + called.slice(-32).map((n) => `<span class="ballMini">${n}</span>`).join("");
      $("bigBall").textContent = called.at(-1) || "--";
      $("tombola").classList.toggle("playing", roundActive);
      renderCards();
    }
    function setPhase(next){
      phase = next;
      const labels = {
        line: ["1 linea", "Marca una fila completa en cualquier carton."],
        two: ["2 lineas", "Ahora se premian dos filas completas."],
        full: ["Casa llena", "Completa todas las casillas numeradas."]
      };
      $("phaseName").textContent = labels[next]?.[0] || "Esperando";
      $("phaseHelp").textContent = labels[next]?.[1] || "La partida empieza automaticamente en 1 minuto.";
      showStage(labels[next]?.[0] || "Bingo", labels[next]?.[1] || "");
    }
    function refreshLeadership(){
      const leader = [...peers].sort((a,b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0];
      isLeader = Boolean(leader && (leader.playerId === api?.playerId || leader.userId === profile.userId));
    }
    function statePayload(){
      return { called, deck, roundActive, roomLocked, phase, claimed };
    }
    function applyState(state){
      called = Array.isArray(state?.called) ? state.called : called;
      deck = Array.isArray(state?.deck) ? state.deck : deck;
      roundActive = Boolean(state?.roundActive);
      roomLocked = Boolean(state?.roomLocked);
      phase = state?.phase || phase;
      claimed = state?.claimed || claimed;
      renderCalled();
    }
    function startCountdown(){
      clearInterval(autoTimer);
      countdown = 60;
      autoTimer = setInterval(() => {
        if (!connected || roundActive) return;
        $("phaseName").textContent = "Esperando";
        $("phaseHelp").textContent = `Inicio automatico en ${countdown}s.`;
        countdown -= 1;
        if (countdown < 0 && isLeader && peers.length >= 1) startRound(false);
      }, 1000);
    }
    function startRound(local, state){
      if (state) { applyState(state); return; }
      if (!isLeader || roundActive) return;
      deck = Array.from({ length: 90 }, (_, i) => i + 1).sort(() => Math.random() - .5);
      called = [];
      claimed = { line: false, two: false, full: false };
      roomLocked = true;
      roundActive = true;
      setPhase("line");
      renderCalled();
      api.send("start", statePayload());
      clearInterval(drawTimer);
      drawTimer = setInterval(() => drawBall(false), 4200);
    }
    function drawBall(local, n){
      if (!roundActive && !local) return;
      const next = n || deck.shift();
      if (!next) return;
      if (!called.includes(next)) called.push(next);
      $("bigBall").classList.remove("pop");
      void $("bigBall").offsetWidth;
      $("bigBall").classList.add("pop");
      renderCalled();
      speak(`Numero ${next}`);
      log(`Salio el numero ${next}.`);
      if (!local) api.send("ball", { n: next, deck, called });
    }
    function rowCounts(){
      return cardsData.map((cardRows) => cardRows.filter((row) => row.filter(Boolean).every((n) => called.includes(n))).length);
    }
    function hasFull(){
      return cardsData.some((cardRows) => cardRows.flat().filter(Boolean).every((n) => called.includes(n)));
    }
    async function claim(kind){
      if (!roundActive) return;
      const rows = rowCounts();
      const ok = kind === "line" ? rows.some((n) => n >= 1) : kind === "two" ? rows.some((n) => n >= 2) : hasFull();
      if (!ok) { log("Todavia no cumple la jugada."); return; }
      if (claimed[kind]) { log("Ese premio ya fue cantado."); return; }
      claimed[kind] = true;
      const payout = kind === "line" ? 500 : kind === "two" ? 1500 : 5000;
      const result = await api.casinoWager("casino-bingo", 0, payout, { kind, cards: cardsData.length, called });
      if (typeof result.wallet_balance === "number") renderWallet(result.wallet_balance);
      api.send("claim", { name: profile.displayName, kind, claimed, phase, payout });
      log(`${profile.displayName} canto ${kind === "full" ? "casa llena" : kind === "two" ? "2 lineas" : "linea"} por ${fmt(payout)} F-coin.`);
      if (kind === "line") setPhase("two");
      if (kind === "two") setPhase("full");
      if (kind === "full") endRound(false);
    }
    function endRound(local){
      roundActive = false;
      roomLocked = false;
      clearInterval(drawTimer);
      log("Partida finalizada. La sala vuelve a aceptar jugadores.");
      if (!local) api.send("end", statePayload());
      startCountdown();
    }
    async function applyCardCount(){
      if (roundActive) { log("No puedes cambiar cartones durante la partida."); return; }
      const count = Math.max(1, Math.min(4, Number($("cardCount").value) || 1));
      const extra = Math.max(0, count - 1) * 500;
      if (extra > 0) {
        const result = await api.casinoWager("casino-bingo-card", extra, 0, { cards: count, source: "extra_cards" });
        if (typeof result.wallet_balance === "number") renderWallet(result.wallet_balance);
        if (result.reason && result.reason !== "ok") { log(`No se pudieron comprar cartones: ${result.reason}`); return; }
      }
      cardsData = Array.from({ length: count }, makeCard);
      renderCards();
      log(`${count} carton(es) listos.`);
    }
    async function connect(code){
      const next = String(code || "").trim().toUpperCase();
      if (!next) return;
      await api.connect(next);
      connected = true;
      $("room").value = next;
      $("status").textContent = `Sala ${next}`;
      if (!cardsData.length) cardsData = [makeCard()];
      renderCards();
      await refreshWallet();
      startCountdown();
    }
    async function setup(){
      cardsData = [makeCard()];
      renderCards();
      try {
        api = await createRealtimeRoom({
          game: "casino-bingo",
          profile,
          maxPlayers: 20,
          onPeers: (count, players) => {
            peers = Array.isArray(players) ? players : peers;
            refreshLeadership();
            $("players").textContent = `${count || 1} jugador(es)`;
            $("status").textContent = connected ? `Sala ${api.room}${roomLocked ? " / partida en curso" : ""}` : "Listo";
          },
          onMessage: (m) => {
            if (m.type === "start") startRound(true, m.payload);
            if (m.type === "ball") { deck = m.payload.deck || deck; called = m.payload.called || called; drawBall(true, m.payload.n); }
            if (m.type === "claim") {
              claimed = m.payload.claimed || claimed;
              if (m.payload.kind === "line") setPhase("two");
              if (m.payload.kind === "two") setPhase("full");
              log(`${m.payload.name} canto premio por ${fmt(m.payload.payout)} F-coin.`);
            }
            if (m.type === "end") endRound(true);
          }
        });
        $("status").textContent = "Listo";
        await refreshWallet();
        if (preset) connect(preset);
      } catch (e) {
        $("status").textContent = e.message || "Sin realtime";
      }
    }
    $("create").onclick = () => connect($("room").value || Math.random().toString(36).slice(2,8).toUpperCase());
    $("join").onclick = () => roomLocked ? log("La partida ya inicio. Espera a la siguiente.") : connect($("room").value);
    $("applyCards").onclick = applyCardCount;
    $("claimLine").onclick = () => claim("line");
    $("claimTwo").onclick = () => claim("two");
    $("claimFull").onclick = () => claim("full");
    setup();
  </script>
</body>
</html>
