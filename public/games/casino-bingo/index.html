<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bingo BET</title>
  <style>
    *{box-sizing:border-box;scrollbar-color:#facc15 #08111f;scrollbar-width:thin}
    html,body{height:100%;margin:0;background:#07111f;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:#08111f;border-left:1px solid #1d3552}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#facc15,#22d3ee);border:2px solid #08111f;border-radius:999px;box-shadow:0 0 12px #22d3ee66}
    body{display:grid;grid-template-rows:auto auto minmax(0,1fr);background:radial-gradient(circle at 50% -10%,#15467a 0,#07111f 50%,#030712 100%)}
    body.embedded{grid-template-rows:auto minmax(0,1fr)}
    body.embedded .top{display:none}
    button,input,select{min-height:32px;border:1px solid #33506f;border-radius:8px;background:#0e1b2d;color:#fff;padding:6px 10px;font-size:12px;box-shadow:inset 0 0 12px #0008}
    button{cursor:pointer;border-color:#facc15;background:linear-gradient(#23334f,#111827);font-weight:1000;box-shadow:0 2px 0 #8a5b00,0 0 14px #facc152d}
    button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
    .top{display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 10px;background:#050914d9;border-bottom:1px solid #facc1526}
    .brand{font-weight:1000;color:#facc15;text-shadow:0 0 14px #facc1544;white-space:nowrap}
    .roomControls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .roomControls input{text-transform:uppercase;width:108px}
    .status{margin-left:auto;color:#cbd5e1;font-size:12px;text-align:right}.roomBadge{display:inline-flex;align-items:center;gap:5px;border:1px solid #22d3ee55;border-radius:999px;background:#061a2c;padding:5px 9px;color:#22d3ee;font-weight:1000}
    .calledLine{display:flex;gap:6px;align-items:center;min-height:50px;padding:7px 10px;overflow-x:auto;background:linear-gradient(90deg,#08111f,#0b1e34,#08111f);border-bottom:1px solid #22d3ee24}
    .calledLabel{position:sticky;left:0;z-index:1;background:#08111f;color:#facc15;font-weight:1000;font-size:12px;padding-right:8px}
    .ballMini{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 18%,#facc15 19% 58%,#b45309 59%);color:#311400;font-size:12px;font-weight:1000;border:2px solid #fff7;box-shadow:0 5px 12px #0008,0 0 14px #facc1545}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,40vw);gap:12px;padding:12px}
    .left,.right{min-height:0;border:1px solid #facc152b;background:#07111fd9;border-radius:14px;box-shadow:inset 0 0 32px #0008,0 0 28px #22d3ee12}
    .left{display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}
    .phase{border:1px solid #22d3ee40;border-radius:12px;background:#061a2c;padding:10px;text-align:center}
    .phase b{display:block;color:#facc15;font-size:18px;text-transform:uppercase;text-shadow:0 0 14px #facc1555}
    .phase span{font-size:12px;color:#cbd5e1}
    .tombola{position:relative;display:grid;place-items:center;min-height:300px;background:radial-gradient(circle at 50% 18%,#f8fafc 0,#dbeafe 34%,#07111f 35%,#09182a 100%);border-radius:18px;border:1px solid #22d3ee33;box-shadow:inset 0 0 40px #0008,0 20px 40px #000a,0 0 28px #22d3ee20;overflow:hidden}
    .tombola:before,.tombola:after{content:"";position:absolute;z-index:0;bottom:35px;width:8px;height:142px;background:linear-gradient(90deg,#9ca3af,#f8fafc,#6b7280);border-radius:999px;box-shadow:0 5px 12px #0008,0 0 10px #ffffff55;transform-origin:50% 100%}
    .tombola:before{left:31%;transform:rotate(18deg)}.tombola:after{right:31%;transform:rotate(-18deg)}
    .cage{position:absolute;z-index:2;width:min(76%,360px);aspect-ratio:1;border-radius:50%;border:11px solid #d1d5db;background:radial-gradient(circle at 36% 28%,#fff9 0 18%,#f8fafc70 19% 44%,#e5e7eb4d 45% 68%,#cbd5e140 100%);box-shadow:inset 0 0 30px #ffffffd9,inset 0 -20px 36px #94a3b84d,0 16px 24px #0008,0 0 0 4px #64748b55}
    .cage:before{content:"";position:absolute;inset:-3px;border-radius:50%;background:radial-gradient(circle at 28% 20%,#fff 0 8%,transparent 24%),linear-gradient(110deg,#fff8 0 11%,transparent 28% 100%);opacity:.82;z-index:5;pointer-events:none}
    .cage:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid #ffffff66;box-shadow:inset 0 0 24px #fff8;z-index:6;pointer-events:none}
    .tombola.playing .cage{animation:wobbleCage 1.2s ease-in-out infinite}
    .spokes{position:absolute;inset:8%;z-index:3;border-radius:50%;animation:spin 10s linear infinite}
    .tombola.playing .spokes{animation-duration:1.15s}
    .spokes span{position:absolute;left:50%;top:50%;width:44%;height:8px;border-radius:999px;background:linear-gradient(90deg,#f8fafc,#9ca3af 48%,#64748b);box-shadow:0 2px 5px #0005,0 0 8px #fff8;transform-origin:0 50%}
    .spokes span:nth-child(1){transform:rotate(-90deg)}.spokes span:nth-child(2){transform:rotate(30deg)}.spokes span:nth-child(3){transform:rotate(150deg)}.spokes span:nth-child(4){transform:rotate(70deg)}.spokes span:nth-child(5){transform:rotate(250deg)}
    .spokes:after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d1d5db 42%,#9ca3af 68%,#6b7280);border:4px solid #e5e7eb;box-shadow:0 4px 14px #0007,0 0 10px #fff8;transform:translate(-50%,-50%)}
    .handle{position:absolute;z-index:1;left:8%;bottom:42px;width:76px;height:9px;background:linear-gradient(90deg,#facc15,#b45309);border-radius:999px;box-shadow:0 3px 0 #713f12,0 0 10px #facc1566;transform:rotate(-38deg)}
    .handle:after{content:"";position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;background:#facc15;border:3px solid #fff7}
    .base{position:absolute;z-index:1;bottom:23px;width:62%;height:14px;border-radius:999px;background:linear-gradient(#f8fafc,#94a3b8 58%,#64748b);box-shadow:0 8px 14px #0009,0 0 12px #ffffff55}
    .base:before{content:"";position:absolute;left:8%;right:8%;bottom:10px;height:120px;border-left:8px solid #cbd5e1;border-right:8px solid #cbd5e1;transform:perspective(160px) rotateX(20deg);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);opacity:.72;filter:drop-shadow(0 4px 6px #0008)}
    .innerBalls{position:absolute;inset:14%;z-index:2;animation:spin 12s linear infinite}
    .tombola.playing .innerBalls{animation-duration:1.6s}
    .innerBall{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff 0 19%,#f8fafc 20% 38%,var(--ball,#facc15) 39% 70%,#334155 71%);color:#111827;font-size:11px;font-weight:1000;border:2px solid #fff9;box-shadow:0 5px 11px #0005,0 0 12px color-mix(in srgb,var(--ball,#facc15),transparent 45%)}
    .innerBall:nth-child(1){left:12%;top:24%;--ball:#3b82f6}.innerBall:nth-child(2){left:56%;top:13%;--ball:#ef4444}.innerBall:nth-child(3){left:27%;top:43%;--ball:#8b5cf6}.innerBall:nth-child(4){left:66%;top:50%;--ball:#f59e0b}.innerBall:nth-child(5){left:16%;top:66%;--ball:#22c55e}.innerBall:nth-child(6){left:50%;top:70%;--ball:#fb923c}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes wobbleCage{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
    @keyframes bounceA{0%,100%{transform:translate(0,0)}25%{transform:translate(24px,-18px)}50%{transform:translate(-18px,16px)}75%{transform:translate(16px,22px)}}
    @keyframes bounceB{0%,100%{transform:translate(0,0)}30%{transform:translate(-22px,18px)}60%{transform:translate(20px,12px)}82%{transform:translate(-8px,-24px)}}
    @keyframes bounceC{0%,100%{transform:translate(0,0)}22%{transform:translate(18px,24px)}55%{transform:translate(-24px,-8px)}78%{transform:translate(12px,-20px)}}
    .tombola.playing .innerBall:nth-child(3n+1){animation:bounceA .72s ease-in-out infinite}
    .tombola.playing .innerBall:nth-child(3n+2){animation:bounceB .66s ease-in-out infinite}
    .tombola.playing .innerBall:nth-child(3n){animation:bounceC .78s ease-in-out infinite}
    .bigBall{position:absolute;right:16px;bottom:52px;z-index:4;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#fff 0 17%,#facc15 18% 58%,#b45309 59% 100%);border:5px solid #fff9;color:#361600;font-size:32px;font-weight:1000;box-shadow:0 18px 30px #000a,0 0 34px #facc1566;transition:transform .45s ease}
    .bigBall.pop{animation:popBall .7s ease}
    @keyframes popBall{0%{transform:translate(-150px,-78px) scale(.36);opacity:.1}45%{transform:translate(-70px,-12px) scale(.82);opacity:1}70%{transform:translate(6px,8px) scale(1.08)}100%{transform:translate(0,0) scale(1);opacity:1}}
    .controls{display:grid;gap:8px}
    .cardsPicker{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .wallet{font-size:12px;color:#cbd5e1}
    .right{display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;padding:10px}
    .rightHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
    .rightHead h2{margin:0;color:#fff;font-size:18px;text-shadow:0 0 18px #22d3ee44}
    .buyBar{order:-1;display:grid;grid-template-columns:1fr minmax(116px,150px) auto;gap:7px;align-items:center;margin:0 0 8px;padding:7px;border:1px solid #22d3ee35;border-radius:10px;background:#061a2c}.buyBar.hidden{display:none}.buyBar span{font-size:11px;color:#cbd5e1}.buyBar b{color:#facc15}.buyBar select{width:100%;min-height:32px;border:1px solid #33506f;border-radius:8px;background:#0e1b2d;color:#fff;padding:6px 8px;font-size:12px;box-shadow:inset 0 0 12px #0008}
    .cards{min-height:0;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:0 4px 8px 0;overscroll-behavior:contain}
    .card{position:relative;flex:0 0 auto;width:max(560px,100%);border:1px solid #22d3ee66;border-radius:10px;background:#eaf7ff;color:#172033;overflow:hidden;box-shadow:0 14px 28px #0008,0 0 18px #22d3ee25}
    .cardHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#4c1d95,#a21caf);color:#fff;padding:5px 8px;font-size:11px;font-weight:1000}
    .grid{display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:40px;gap:1px;padding:6px;background:#b8c7d9}
    .cell{height:auto;min-height:40px;display:grid;place-items:center;background:#fff;font-size:18px;font-weight:1000;color:#5b1025;border:1px solid #cad7e5;user-select:none}
    .cell.blank{background:#edf2f7;color:transparent}
    .cell.marked{background:#facc15;color:#2b1500;box-shadow:inset 0 0 0 3px #fff7,0 0 10px #facc1555}
    .cell.called:not(.marked){outline:3px solid #22d3ee;outline-offset:-4px}
    .claimBtn{position:absolute;right:8px;top:28px;z-index:2;min-height:26px;border-color:#facc15;background:linear-gradient(#facc15,#d97706);color:#220c00;font-size:10px;text-transform:uppercase;box-shadow:0 0 18px #facc1580}
    .toastStage{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:#02061788;backdrop-filter:blur(2px);pointer-events:none}
    .toastStage.show{display:grid;animation:fade .9s ease both}
    .toastStage div{border:2px solid #facc15;border-radius:16px;background:#07111f;padding:22px 32px;text-align:center;box-shadow:0 0 40px #facc1544}
    .toastStage b{display:block;font-size:34px;color:#facc15;text-shadow:0 0 20px #facc1580;text-transform:uppercase}
    .toastStage span{color:#cbd5e1}
    .sideToast{position:fixed;right:16px;bottom:16px;z-index:30;display:none;max-width:min(320px,calc(100vw - 32px));border:1px solid #22d3ee66;border-radius:12px;background:#07111ff2;padding:10px 12px;box-shadow:0 14px 34px #000b,0 0 18px #22d3ee33;pointer-events:none}
    .sideToast.show{display:block;animation:sidePop 2.4s ease both}
    .sideToast b{display:block;color:#facc15;font-size:12px;text-transform:uppercase}
    .sideToast span{display:block;margin-top:2px;color:#cbd5e1;font-size:11px}
    @keyframes fade{0%,100%{opacity:0}15%,82%{opacity:1}}
    @keyframes sidePop{0%,100%{opacity:0;transform:translateY(10px)}12%,88%{opacity:1;transform:translateY(0)}}
    @media(max-width:860px){html,body{overflow:auto}.layout{grid-template-columns:1fr}.left{min-height:560px}.status{width:100%;margin-left:0;text-align:left}.top{flex-wrap:wrap}.brand{width:100%}.right{min-height:520px;max-height:72vh}.grid{grid-auto-rows:36px}.cell{min-height:36px;font-size:16px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">BINGO BET</div>
    <div class="roomControls">
      <button id="create">Crear</button>
      <input id="room" placeholder="Codigo" />
      <button id="join">Unirse</button>
    </div>
    <span id="status" class="status">Conectando...</span>
  </header>

  <section class="calledLine" id="calledLine"><span class="calledLabel">Bolas</span></section>

  <main class="layout">
    <aside class="left">
      <div class="phase">
        <b id="phaseName">Esperando</b>
        <span id="phaseHelp">La partida empieza automaticamente en 1 minuto.</span>
      </div>
      <div class="tombola" id="tombola">
        <div class="cage">
          <div class="innerBalls"><span class="innerBall">18</span><span class="innerBall">27</span><span class="innerBall">44</span><span class="innerBall">75</span><span class="innerBall">29</span><span class="innerBall">71</span></div>
          <div class="spokes"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="handle"></div>
        <div class="base"></div>
        <div class="bigBall" id="bigBall">--</div>
      </div>
      <div class="controls">
        <div class="wallet">Saldo F-coin: <b id="wallet">...</b></div>
        <div class="wallet" id="log">Crea o entra a una sala para jugar.</div>
      </div>
    </aside>

    <section class="right">
      <div class="rightHead">
        <h2>Cartones</h2>
        <span id="players">0 jugador(es)</span>
      </div>
      <div class="buyBar" id="buyBar">
        <span><b id="cardTotal">0/5</b> cartones · Premio <b id="prizePool">0</b> F</span>
        <select id="cardNumber" aria-label="Numero de carton"></select>
        <button id="buyCard">Comprar carton 100 F</button>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div class="toastStage" id="stageToast"><div><b id="stageTitle"></b><span id="stageText"></span></div></div>
  <div class="sideToast" id="sideToast"><b id="sideToastTitle"></b><span id="sideToastText"></span></div>

  <script src="/games/realtime-room.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const profile = { userId: p.get("userId") || "", displayName: p.get("displayName") || "Jugador", avatarUrl: p.get("avatarUrl") || "" };
    const $ = (id) => document.getElementById(id);
    document.body.classList.toggle("embedded", p.get("embed") === "1");
    let api, connected = false, peers = [], isLeader = false, wallet = null;
    let cardsData = [], cardNumbers = [], called = [], deck = [], markedCells = new Set(), roundActive = false, roomLocked = false, phase = "line";
    let autoTimer = null, drawTimer = null, phasePauseTimer = null, countdown = 60, claimed = { line: false, two: false, full: false };
    let cardFees = 0, prizePool = 0, paidPrizes = 0, prepareEndsAt = 0, nextDrawAt = 0, cardNonce = 0;
    let reservedCards = {};
    const BALL_DRAW_INTERVAL_MS = 5000;
    const knownCardSignatures = new Set();
    const cardCatalogCache = new Map();
    const preset = (p.get("room") || "").toUpperCase();
    if (preset) $("room").value = preset;

    function fmt(n){ return Number(n || 0).toLocaleString("es-CL"); }
    function log(text){ $("log").textContent = text; }
    function speak(text){
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "es-ES"; u.rate = .92; u.pitch = 1.05;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch {}
    }
    function showStage(title, text){
      $("stageTitle").textContent = title;
      $("stageText").textContent = text;
      $("stageToast").classList.remove("show");
      void $("stageToast").offsetWidth;
      $("stageToast").classList.add("show");
      speak(`${title}. ${text}`);
    }
    function showSideToast(title, text){
      $("sideToastTitle").textContent = title;
      $("sideToastText").textContent = text;
      $("sideToast").classList.remove("show");
      void $("sideToast").offsetWidth;
      $("sideToast").classList.add("show");
    }
    function renderWallet(next){
      if (typeof next === "number") wallet = next;
      $("wallet").textContent = wallet === null ? "..." : fmt(wallet);
    }
    function updatePrizePool(){
      prizePool = Math.min(10000, Math.floor(cardFees * 1.3));
      $("prizePool").textContent = fmt(prizePool);
      $("cardTotal").textContent = `${cardsData.length}/5`;
      $("buyCard").disabled = roundActive || cardsData.length >= 5;
      $("buyBar")?.classList.toggle("hidden", roundActive);
      renderCardNumberOptions();
    }
    function playerKey(){
      return profile.userId || api?.playerId || "local";
    }
    function cardOwner(cardNo){
      return reservedCards[String(cardNo)] || null;
    }
    function cardIsMine(cardNo){
      const owner = cardOwner(cardNo);
      return owner && (owner.userId === profile.userId || owner.playerId === api?.playerId);
    }
    function renderCardNumberOptions(){
      const select = $("cardNumber");
      if (!select) return;
      const previous = Number(select.value || 0);
      const owned = new Set(cardNumbers.map(Number));
      const options = [];
      for (let n = 1; n <= 100; n++) {
        if (owned.has(n)) continue;
        const owner = cardOwner(n);
        if (owner && !cardIsMine(n)) continue;
        options.push(n);
      }
      select.innerHTML = options.length
        ? options.map((n) => `<option value="${n}">Carton ${String(n).padStart(3, "0")}</option>`).join("")
        : `<option value="">Sin cartones</option>`;
      if (options.includes(previous)) select.value = String(previous);
      $("buyCard").disabled = roundActive || cardsData.length >= 5 || options.length === 0;
    }
    async function refreshWallet(){
      if (!api?.getWallet) return;
      const result = await api.getWallet();
      if (typeof result.balance === "number") renderWallet(result.balance);
    }
    function seedHash(input){
      let h = 2166136261;
      for (let i = 0; i < String(input).length; i++) {
        h ^= String(input).charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function seededRandom(seed){
      let state = seedHash(seed) || 1;
      return () => {
        state = Math.imul(1664525, state) + 1013904223;
        return ((state >>> 0) / 4294967296);
      };
    }
    function cardSignature(cardRows){
      return cardRows.map((row) => row.map((value) => value || "-").join(",")).join("|");
    }
    function makeCard(seed = `${api?.room || preset || "LOCAL"}:${profile.userId || api?.playerId || "anon"}:${cardNonce++}`){
      const rand = seededRandom(seed);
      const rows = Array.from({ length: 3 }, () => Array(9).fill(null));
      const used = new Set();
      for (let col = 0; col < 9; col++) {
        const min = col === 0 ? 1 : col * 10;
        const max = col === 8 ? 90 : col * 10 + 9;
        const colNums = [];
        while (colNums.length < 2) {
          const n = Math.floor(rand() * (max - min + 1)) + min;
          if (!used.has(n)) { used.add(n); colNums.push(n); }
        }
        const rowA = Math.floor(rand() * 3);
        let rowB = Math.floor(rand() * 3);
        while (rowB === rowA) rowB = Math.floor(rand() * 3);
        rows[rowA][col] = colNums[0];
        rows[rowB][col] = colNums[1];
      }
      rows.forEach((row) => {
        while (row.filter(Boolean).length > 5) {
          const filled = row.map((v, i) => v ? i : -1).filter((i) => i >= 0);
          row[filled[Math.floor(rand() * filled.length)]] = null;
        }
        while (row.filter(Boolean).length < 5) {
          const empty = row.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
          const col = empty[Math.floor(rand() * empty.length)];
          const min = col === 0 ? 1 : col * 10;
          const max = col === 8 ? 90 : col * 10 + 9;
          let n = Math.floor(rand() * (max - min + 1)) + min;
          while (used.has(n)) n = Math.floor(rand() * (max - min + 1)) + min;
          used.add(n); row[col] = n;
        }
      });
      return rows;
    }
    function makeUniqueCard(reason = "card"){
      let card = null;
      let signature = "";
      for (let attempt = 0; attempt < 50; attempt++) {
        card = makeCard(`${api?.room || preset || "LOCAL"}:${profile.userId || api?.playerId || "anon"}:${reason}:${cardNonce++}:${attempt}`);
        signature = cardSignature(card);
        if (!knownCardSignatures.has(signature)) break;
      }
      knownCardSignatures.add(signature);
      return card;
    }
    function buildCardCatalog(){
      const roomSeed = api?.room || preset || "LOCAL";
      if (cardCatalogCache.has(roomSeed)) return cardCatalogCache.get(roomSeed);
      const catalog = {};
      const seen = new Set();
      for (let n = 1; n <= 100; n++) {
        let attempt = 0;
        let card = makeCard(`${roomSeed}:carton:${n}:v0`);
        let signature = cardSignature(card);
        while (seen.has(signature) && attempt < 80) {
          attempt += 1;
          card = makeCard(`${roomSeed}:carton:${n}:v${attempt}`);
          signature = cardSignature(card);
        }
        seen.add(signature);
        catalog[n] = card;
      }
      cardCatalogCache.set(roomSeed, catalog);
      return catalog;
    }
    function makeNumberedCard(cardNo){
      const catalog = buildCardCatalog();
      const card = catalog[Number(cardNo)] || makeCard(`${api?.room || preset || "LOCAL"}:carton:${Number(cardNo)}`);
      knownCardSignatures.add(cardSignature(card));
      return card.map((row) => row.slice());
    }
    function completedRowsForCard(cardRows, cardIndex){
      return cardRows.filter((row, rowIndex) => row.every((n, colIndex) => !n || markedCells.has(`${cardIndex}:${rowIndex}:${colIndex}`))).length;
    }
    function cardHasFull(cardRows, cardIndex){
      return cardRows.every((row, rowIndex) => row.every((n, colIndex) => !n || markedCells.has(`${cardIndex}:${rowIndex}:${colIndex}`)));
    }
    function claimKindForCard(cardRows, cardIndex){
      const rows = completedRowsForCard(cardRows, cardIndex);
      if (!claimed.full && cardHasFull(cardRows, cardIndex)) return "full";
      if (!claimed.two && rows >= 2 && phase !== "line") return "two";
      if (!claimed.line && rows >= 1) return "line";
      return "";
    }
    function claimLabel(kind){
      return kind === "full" ? "Casa llena" : kind === "two" ? "Cantar 2 lineas" : "Cantar linea";
    }
    function renderCards(){
      cardsData.forEach((cardRows) => knownCardSignatures.add(cardSignature(cardRows)));
      $("cards").innerHTML = cardsData.map((cardRows, cardIndex) => `
        <article class="card">
          <div class="cardHead"><span>CARTON N.${String(cardNumbers[cardIndex] || cardIndex + 1).padStart(4, "0")}</span><span>100 F</span></div>
          <div class="grid">
            ${cardRows.flatMap((row, rowIndex) => row.map((value, colIndex) => {
              const key = `${cardIndex}:${rowIndex}:${colIndex}`;
              const calledNumber = value && called.includes(value);
              const marked = markedCells.has(key);
              return `<button class="cell ${value ? "" : "blank"} ${calledNumber ? "called" : ""} ${marked ? "marked" : ""}" data-card="${cardIndex}" data-row="${rowIndex}" data-col="${colIndex}" data-key="${key}" ${value ? "" : "disabled"}>${value || ""}</button>`;
            })).join("")}
          </div>
          ${roundActive && claimKindForCard(cardRows, cardIndex) ? `<button class="claimBtn" data-claim="${claimKindForCard(cardRows, cardIndex)}" data-card="${cardIndex}">${claimLabel(claimKindForCard(cardRows, cardIndex))}</button>` : ""}
        </article>
      `).join("");
      document.querySelectorAll(".cell").forEach((cell) => {
        cell.onclick = () => {
          if (!cell.textContent) return;
          if (!called.includes(Number(cell.textContent))) return;
          const key = cell.dataset.key;
          if (!key) return;
          if (markedCells.has(key)) markedCells.delete(key);
          else markedCells.add(key);
          renderCards();
        };
      });
      document.querySelectorAll(".claimBtn").forEach((btn) => {
        btn.onclick = () => claim(btn.dataset.claim, Number(btn.dataset.card || 0));
      });
      updatePrizePool();
    }
    function renderCalled(){
      $("calledLine").innerHTML = `<span class="calledLabel">Bolas</span>` + called.slice(-32).map((n) => `<span class="ballMini">${n}</span>`).join("");
      $("bigBall").textContent = called.length ? called[called.length - 1] : "--";
      $("tombola").classList.toggle("playing", roundActive);
      renderCards();
    }
    function setPhase(next){
      phase = next;
      const labels = {
        line: ["1 linea", "Marca una fila completa en cualquier carton."],
        two: ["2 lineas", "Ahora se premian dos filas completas."],
        full: ["Casa llena", "Completa todas las casillas numeradas."]
      };
      $("phaseName").textContent = labels[next]?.[0] || "Esperando";
      $("phaseHelp").textContent = labels[next]?.[1] || "La partida empieza automaticamente en 1 minuto.";
      showStage(labels[next]?.[0] || "Bingo", labels[next]?.[1] || "");
    }
    function refreshLeadership(){
      const leader = [...peers].sort((a,b) => (a.joinedAt || 0) - (b.joinedAt || 0))[0];
      isLeader = Boolean(leader && (leader.playerId === api?.playerId || leader.userId === profile.userId));
      if (isLeader && connected && !roundActive && !prepareEndsAt) {
        prepareEndsAt = Date.now() + 60000;
        api?.send("state", statePayload());
      }
    }
    function statePayload(){
      return { called, deck, roundActive, roomLocked, phase, claimed, cardFees, prizePool, paidPrizes, prepareEndsAt, nextDrawAt, reservedCards };
    }
    function applyState(state){
      called = Array.isArray(state?.called) ? state.called : called;
      deck = Array.isArray(state?.deck) ? state.deck : deck;
      roundActive = Boolean(state?.roundActive);
      roomLocked = Boolean(state?.roomLocked);
      phase = state?.phase || phase;
      claimed = state?.claimed || claimed;
      cardFees = Number(state?.cardFees || cardFees || 0);
      prizePool = Number(state?.prizePool || prizePool || 0);
      paidPrizes = Number(state?.paidPrizes || paidPrizes || 0);
      prepareEndsAt = Number(state?.prepareEndsAt || prepareEndsAt || 0);
      nextDrawAt = Number(state?.nextDrawAt || nextDrawAt || 0);
      reservedCards = state?.reservedCards && typeof state.reservedCards === "object" ? state.reservedCards : reservedCards;
      renderCalled();
      updatePrizePool();
      if (roundActive && isLeader) ensureDrawTimer();
    }
    function startCountdown(){
      clearInterval(autoTimer);
      if (!prepareEndsAt) prepareEndsAt = Date.now() + 60000;
      autoTimer = setInterval(() => {
        try {
          if (!connected || roundActive) return;
          countdown = Math.max(0, Math.ceil((prepareEndsAt - Date.now()) / 1000));
          $("phaseName").textContent = "Esperando";
          $("phaseHelp").textContent = `Inicio automatico en ${Math.max(0, countdown)}s.`;
          if (countdown <= 0 && isLeader && Math.max(1, peers.length) >= 1) startRound(false);
        } catch (error) {
          console.error("Bingo timer error", error);
          clearInterval(autoTimer);
          log("El temporizador tuvo un problema, pero la mesa sigue abierta.");
        }
      }, 1000);
    }
    function startRound(local, state){
      if (state) { applyState(state); return; }
      if (!isLeader || roundActive) return;
      clearTimeout(phasePauseTimer);
      deck = Array.from({ length: 90 }, (_, i) => i + 1).sort(() => Math.random() - .5);
      called = [];
      markedCells = new Set();
      claimed = { line: false, two: false, full: false };
      paidPrizes = 0;
      roomLocked = true;
      roundActive = true;
      nextDrawAt = Date.now() + BALL_DRAW_INTERVAL_MS;
      setPhase("line");
      renderCalled();
      api.send("start", statePayload());
      ensureDrawTimer();
    }
    function ensureDrawTimer(){
      if (!isLeader || !roundActive) return;
      clearInterval(drawTimer);
      drawTimer = setInterval(() => {
        if (!roundActive) {
          clearInterval(drawTimer);
          drawTimer = null;
          return;
        }
        if (Date.now() >= nextDrawAt) drawBall(false);
      }, 1000);
    }
    function drawBall(local, n){
      if (!roundActive && !local) return;
      const next = n || deck.shift();
      if (!next) {
        if (!local) endRound(false);
        return;
      }
      if (!called.includes(next)) called.push(next);
      if (!local) nextDrawAt = Date.now() + BALL_DRAW_INTERVAL_MS;
      $("bigBall").classList.remove("pop");
      void $("bigBall").offsetWidth;
      $("bigBall").classList.add("pop");
      renderCalled();
      speak(`Numero ${next}`);
      log(`Salio el numero ${next}.`);
      if (!local) api.send("ball", { n: next, deck, called, nextDrawAt });
    }
    function rowCounts(){
      return cardsData.map((cardRows, cardIndex) => completedRowsForCard(cardRows, cardIndex));
    }
    function hasFull(){
      return cardsData.some((cardRows, cardIndex) => cardHasFull(cardRows, cardIndex));
    }
    function shoutBingo(){
      try {
        const u = new SpeechSynthesisUtterance("BINGOOO");
        u.lang = "es-ES"; u.rate = .78; u.pitch = 1.22; u.volume = 1;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch {}
    }
    function publishAward(kind, payout){
      window.parent?.postMessage({
        type: "game:playerAward",
        userId: profile.userId,
        playerId: api?.playerId,
        award: kind,
        payout,
      }, "*");
    }
    function schedulePrizePause(kind, broadcast = true){
      clearTimeout(phasePauseTimer);
      if (kind === "full") {
        nextDrawAt = Number(nextDrawAt || 0) > Date.now() ? nextDrawAt : Date.now() + 15000;
        clearInterval(drawTimer);
        drawTimer = null;
        log("Casa llena cantada. La partida se cierra en 15 segundos.");
        phasePauseTimer = setTimeout(() => {
          if (broadcast) endRound(false);
        }, 15000);
        if (broadcast && isLeader) api?.send("state", statePayload());
        return;
      }
      const nextPhase = kind === "line" ? "two" : "full";
      nextDrawAt = Number(nextDrawAt || 0) > Date.now() ? nextDrawAt : Date.now() + 15000 + BALL_DRAW_INTERVAL_MS;
      log(`Bingo cantado. La mesa continua con ${nextPhase === "two" ? "2 lineas" : "casa llena"} en 15 segundos.`);
      phasePauseTimer = setTimeout(() => {
        setPhase(nextPhase);
        if (broadcast && isLeader) api?.send("state", statePayload());
      }, 15000);
      if (broadcast && isLeader) api?.send("state", statePayload());
    }
    async function claim(kind, cardIndex = -1){
      if (!roundActive) return;
      const rows = rowCounts();
      const ok = cardIndex >= 0
        ? (kind === "line" ? rows[cardIndex] >= 1 : kind === "two" ? rows[cardIndex] >= 2 : cardHasFull(cardsData[cardIndex], cardIndex))
        : (kind === "line" ? rows.some((n) => n >= 1) : kind === "two" ? rows.some((n) => n >= 2) : hasFull());
      if (!ok) { log("Todavia no cumple la jugada."); return; }
      if (claimed[kind]) { log("Ese premio ya fue cantado."); return; }
      claimed[kind] = true;
      shoutBingo();
      const payout = kind === "line" ? Math.floor(prizePool * .25) : kind === "two" ? Math.floor(prizePool * .35) : Math.max(0, prizePool - paidPrizes);
      paidPrizes += payout;
      const result = await api.casinoWager("casino-bingo", 0, payout, { kind, cards: cardsData.length, called });
      if (typeof result.wallet_balance === "number") renderWallet(result.wallet_balance);
      publishAward(kind, payout);
      schedulePrizePause(kind);
      api.send("claim", { name: profile.displayName, userId: profile.userId, playerId: api?.playerId, kind, claimed, phase, payout, paidPrizes, nextDrawAt });
      log(`${profile.displayName} canto ${kind === "full" ? "casa llena" : kind === "two" ? "2 lineas" : "linea"} por ${fmt(payout)} F-coin.`);
    }
    function endRound(local){
      roundActive = false;
      roomLocked = false;
      clearInterval(drawTimer);
      clearTimeout(phasePauseTimer);
      drawTimer = null;
      prepareEndsAt = Date.now() + 60000;
      nextDrawAt = 0;
      log("Partida finalizada. La sala vuelve a aceptar jugadores.");
      if (!local) api.send("end", statePayload());
      startCountdown();
    }
    async function buyCard(){
      try {
        if (!connected || !api) { log("Primero crea o entra a una sala."); return; }
        if (roundActive) { log("No puedes comprar cartones durante la partida."); return; }
        if (cardsData.length >= 5) { log("Maximo 5 cartones por usuario."); return; }
        const selectedNumber = Number($("cardNumber")?.value || 0);
        if (!selectedNumber || selectedNumber < 1 || selectedNumber > 100) { log("Escoge un numero de carton disponible."); return; }
        if (cardOwner(selectedNumber) && !cardIsMine(selectedNumber)) { log("Ese carton ya no esta disponible en esta sala."); renderCardNumberOptions(); return; }
        $("buyCard").disabled = true;
        const result = await api.casinoWager("casino-bingo-card", 100, 0, { cards: cardsData.length + 1, cardNumber: selectedNumber, source: "numbered_card" });
        if (typeof result.wallet_balance === "number") renderWallet(result.wallet_balance);
        if (result.reason && result.reason !== "ok") { log(`No se pudo comprar carton: ${result.reason}`); return; }
        const nextCard = makeNumberedCard(selectedNumber);
        const signature = cardSignature(nextCard);
        reservedCards[String(selectedNumber)] = { userId: profile.userId, playerId: api?.playerId, name: profile.displayName, at: Date.now() };
        cardsData.push(nextCard);
        cardNumbers.push(selectedNumber);
        cardFees += 100;
        updatePrizePool();
        renderCards();
        api.send("card_purchase", { amount: 100, cardFees, prizePool, cardSignature: signature, cardNumber: selectedNumber, owner: reservedCards[String(selectedNumber)] });
        showSideToast("Carton comprado", "-100 F-coin descontados.");
        log(`Carton ${selectedNumber} comprado: -100 F-coin. ${cardsData.length} carton(es) listos. Fondo: ${fmt(prizePool)} F-coin.`);
      } catch (error) {
        console.error("Bingo buyCard error", error);
        log(`No se pudo comprar carton: ${error?.message || "error inesperado"}`);
      } finally {
        updatePrizePool();
      }
    }
    async function connect(code){
      const next = String(code || "").trim().toUpperCase();
      if (!next) return;
      await api.connect(next);
      connected = true;
      $("room").value = next;
      $("status").innerHTML = `<span class="roomBadge">Sala ${next}</span>`;
      cardsData = [];
      cardNumbers = [];
      markedCells = new Set();
      reservedCards = {};
      cardFees = 0;
      prizePool = 0;
      renderCards();
      updatePrizePool();
      await refreshWallet();
      startCountdown();
      api.send("state_request", { userId: profile.userId, playerId: api.playerId });
    }
    async function setup(){
      cardsData = [];
      cardNumbers = [];
      renderCards();
      try {
        api = await createRealtimeRoom({
          game: "casino-bingo",
          profile,
          maxPlayers: 20,
          onPeers: (count, players) => {
            peers = Array.isArray(players) ? players : peers;
            refreshLeadership();
            $("players").textContent = `${count || 1} jugador(es)`;
            $("status").innerHTML = connected ? `<span class="roomBadge">Sala ${api.room}${roomLocked ? " / en curso" : ""}</span>` : "Listo";
          },
          onMessage: (m) => {
            if (m.type === "state_request" && isLeader) api.send("state", statePayload());
            if (m.type === "state") {
              applyState(m.payload);
              startCountdown();
            }
            if (m.type === "start") startRound(true, m.payload);
            if (m.type === "ball") { deck = m.payload.deck || deck; called = m.payload.called || called; nextDrawAt = Number(m.payload.nextDrawAt || nextDrawAt || 0); drawBall(true, m.payload.n); }
            if (m.type === "claim") {
              claimed = m.payload.claimed || claimed;
              paidPrizes = Number(m.payload.paidPrizes || paidPrizes || 0);
              nextDrawAt = Number(m.payload.nextDrawAt || nextDrawAt || 0);
              window.parent?.postMessage({ type: "game:playerAward", userId: m.payload.userId, playerId: m.payload.playerId, award: m.payload.kind, payout: m.payload.payout }, "*");
              schedulePrizePause(m.payload.kind, false);
              log(`${m.payload.name} canto premio por ${fmt(m.payload.payout)} F-coin.`);
            }
            if (m.type === "end") endRound(true);
            if (m.type === "card_purchase") {
              if (m.payload.cardSignature) knownCardSignatures.add(String(m.payload.cardSignature));
              if (m.payload.cardNumber && m.payload.owner) reservedCards[String(m.payload.cardNumber)] = m.payload.owner;
              cardFees = Math.max(cardFees, Number(m.payload.cardFees || 0));
              prizePool = Math.max(prizePool, Number(m.payload.prizePool || 0));
              updatePrizePool();
            }
          }
        });
        $("status").textContent = "Listo";
        await refreshWallet();
        if (preset) connect(preset);
      } catch (e) {
        $("status").textContent = e.message || "Sin realtime";
      }
    }
    $("create").onclick = () => connect($("room").value || Math.random().toString(36).slice(2,8).toUpperCase());
    $("join").onclick = () => roomLocked ? log("La partida ya inicio. Espera a la siguiente.") : connect($("room").value);
    $("buyCard").onclick = buyCard;
    setup();
  </script>
</body>
