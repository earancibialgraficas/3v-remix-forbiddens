<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ruleta Retro</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#080a12;color:#f8fafc;font-family:Inter,Arial,sans-serif}
    body{overflow:auto;scrollbar-color:#67e8f9 #090b12;scrollbar-width:thin}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:#090b12;border-left:1px solid #1f2937}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#67e8f9,#16a34a);border:2px solid #090b12;border-radius:999px;box-shadow:0 0 12px #67e8f966}
    button,input{font:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-rows:minmax(0,1fr);gap:8px;padding:8px 10px 10px;background:radial-gradient(circle at 50% 6%,#1d6934 0,#0b1a17 30%,#070812 100%)}
    .status{color:#cbd5e1;font-size:12px;white-space:nowrap}
    .layout{max-width:1440px;width:100%;min-height:0;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px);gap:14px}
    .tableSide{min-width:0;display:grid;grid-template-rows:minmax(230px,34vh) auto auto minmax(240px,1fr) auto;gap:9px}
    .panel,.sideCard{border:1px solid #374151;background:#10131ce6;border-radius:10px;box-shadow:0 18px 58px #0009,0 0 28px #0f70372b}
    .wheelPanel{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#15251f 0,#10131c 60%)}
    .wheelPanel:before{content:"";position:absolute;inset:auto 8% -44px;height:112px;border-radius:50%;background:#0b4f25;filter:blur(20px);opacity:.9}
    .wheelPanel:after{content:"";position:absolute;inset:12px;border-radius:10px;box-shadow:inset 0 0 52px #facc1514,inset 0 0 90px #22c55e12;pointer-events:none}
    .pointer{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid #facc15;z-index:9;filter:drop-shadow(0 0 7px #facc15)}
    .wheel{width:min(284px,58vw,31vh);aspect-ratio:1;border-radius:50%;position:relative;border:4px solid #1b4d20;background:#083d1e;box-shadow:0 0 0 8px #5b390d,0 0 0 13px #113914,0 18px 60px #000d,0 0 34px #22c55e33}
    .wheelRotor{position:absolute;inset:0;border-radius:50%;transition:transform 3s cubic-bezier(.12,.8,.18,1)}
    .wheelRotor:before{content:"";position:absolute;inset:21px;border-radius:50%;background:repeating-conic-gradient(#ca171e 0 9.47deg,#151515 9.47deg 18.94deg);box-shadow:inset 0 0 0 9px #0e612d,inset 0 0 18px #000}
    .wheelRotor:after{content:"";position:absolute;inset:76px;border-radius:50%;background:radial-gradient(circle,#0d5f2b 0,#073d1b 72%);box-shadow:inset 0 0 0 1px #0b7a34,0 0 24px #0008}
    .wheelNumber{position:absolute;left:50%;top:50%;z-index:3;width:19px;height:12px;margin:-6px 0 0 -9.5px;display:grid;place-items:center;border-radius:2px;color:#fff;font-size:7.5px;font-weight:1000;text-shadow:0 1px 2px #000,0 0 5px #000;pointer-events:none;transform-origin:center center}
    .rouletteBall{position:absolute;left:50%;top:50%;z-index:8;width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#e5e7eb 40%,#9ca3af 74%);box-shadow:0 4px 9px #000b,0 0 12px #fff9;transform:translate(-50%,-50%);transition:transform 3s cubic-bezier(.12,.8,.18,1)}
    .hub{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0a8,#b47a05 72%);z-index:7;box-shadow:0 4px 14px #0009,0 0 16px #facc1544}
    .lastPanel{display:flex;align-items:center;gap:10px;padding:7px 9px}
    .lastBall{width:40px;height:32px;border-radius:8px;border:2px solid #facc15;background:#0b8f42;display:grid;place-items:center;font-weight:1000;color:#fff;box-shadow:0 0 18px #facc1544}
    .betText{min-width:0;color:#cbd5e1;font-size:12px}.betText b{color:#fff}
    .roomBar{display:grid;grid-template-columns:auto minmax(86px,116px) auto auto 1fr;gap:7px;align-items:center;padding:7px 9px}
    .roomBar input{height:32px;border:1px solid #374151;background:#090b12;color:#fff;border-radius:7px;padding:0 9px;text-transform:uppercase}
    .roomBar button,.actionBtn{height:32px;border:1px solid #16a34a;background:linear-gradient(#1aa34c,#0f672d);color:white;border-radius:7px;padding:0 10px;font-size:11px;font-weight:900;box-shadow:0 0 14px #22c55e22}
    .wallet{justify-self:end;display:flex;gap:8px;align-items:center;color:#cbd5e1;font-size:12px}.wallet b{color:#facc15;font-size:16px}
    .betPanel{background:#075a28;border:2px solid #b88700;padding:8px;border-radius:12px;display:grid;gap:8px;box-shadow:inset 0 0 0 1px #2f8b47,inset 0 0 28px #0006,0 0 28px #facc1524}
    .numGrid{display:grid;grid-template-columns:54px repeat(12,minmax(42px,1fr)) 44px;grid-template-rows:repeat(3,42px);overflow:hidden;border:1px solid #2d7d41;border-radius:7px 7px 0 0}
    .outside{display:grid;grid-template-columns:58px repeat(6,1fr) 48px;overflow:hidden;border:1px solid #2d7d41;border-top:0;border-radius:0 0 8px 8px}
    .cell{min-width:0;border:1px solid #24462c;background:#161819;color:#fff;font-weight:1000;display:grid;place-items:center;position:relative}
    .cell.red{background:#c8171d}.cell.black{background:#111318}.cell.green{background:#0b8d42}.cell.out{height:36px;background:#0d6630}.cell.selected{outline:3px solid #facc15;outline-offset:-5px;z-index:2;box-shadow:inset 0 0 18px #facc1566}
    .zeroA{grid-row:1/3;font-size:22px}.zeroB{grid-row:3/4;font-size:22px}.sidePay{font-size:11px;background:#0d6630;color:#d9ffe5}
    .controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:1px 0}
    .chip{width:50px;height:50px;border-radius:50%;border:4px dashed #a0a7b3;background:#4b5563;color:#fff;font-weight:1000;box-shadow:inset 0 0 0 3px #626b78,0 8px 20px #0007}
    .chip.active{background:#f8fafc;color:#111827;border-color:#facc15;box-shadow:0 0 24px #facc1555}
    .spin{width:64px;height:64px;border-radius:50%;border:3px solid #facc15;background:#16a34a;color:#fff;font-weight:1000;box-shadow:0 0 30px #facc1588,0 0 20px #22c55e66;text-shadow:0 1px 2px #000}
    .ghost{border:1px solid #1d4ed8;background:#172554;color:#bfdbfe;border-radius:10px;padding:10px 14px;font-weight:900}
    .side{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px}
    .sideCard{padding:10px;background:#171717e8;box-shadow:0 18px 48px #0009,0 0 22px #facc1512}
    .sideHead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2b2b2b;margin:-12px -12px 12px;padding:12px}
    .sideHead h2{margin:0;color:#facc15;font-size:13px;font-weight:1000;letter-spacing:.04em}
    .metric{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #293241;background:#0d111a;border-radius:9px;padding:10px;margin-top:8px;color:#cbd5e1;font-size:12px}.metric b{color:#fff;font-size:18px}
    .heat{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:7px 9px;background:#1f2937;color:#fff;font-weight:900;font-size:12px}.pill.red{background:#b91c1c}.pill.green{background:#047857}.pill.black{background:#020617}
    table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#9ca3af;padding:9px 4px}td{padding:9px 4px;border-top:1px solid #2a2a2a}.pos{color:#22c55e;font-weight:1000}.neg{color:#fb7185;font-weight:1000}
    @media(max-width:1080px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}.sideCard:last-child{grid-column:1/-1}.tableSide{grid-template-rows:230px auto auto auto auto}.wheel{width:220px}.numGrid{grid-template-columns:48px repeat(12,minmax(35px,1fr)) 38px}.cell{font-size:12px}}
    @media(max-width:680px){.shell{padding:8px}.status{margin-left:0;width:100%}.roomBar{grid-template-columns:1fr 1fr;align-items:stretch}.wallet{justify-self:start}.betPanel{overflow-x:auto}.numGrid,.outside{min-width:760px}.side{grid-template-columns:1fr}.chip{width:48px;height:48px;font-size:12px}.spin{width:64px;height:64px}.controls{justify-content:flex-start}.tableSide{grid-template-rows:210px auto auto auto auto}}
  </style>
</head>
<body>
  <div class="shell">
    <main class="layout">
      <section class="tableSide">
        <div class="panel wheelPanel">
          <div class="pointer"></div>
          <div id="wheel" class="wheel">
            <div id="rotor" class="wheelRotor"></div>
            <div id="ball" class="rouletteBall"></div>
            <div class="hub"></div>
          </div>
        </div>

        <div class="panel lastPanel">
          <div id="last" class="lastBall">--</div>
          <div class="betText">Apuesta: <b id="betLabel">36</b> por <b id="betAmount">25</b> F-coin</div>
        </div>

        <div class="panel roomBar">
          <button id="create">Crear sala</button>
          <input id="room" placeholder="Codigo" />
          <button id="join">Unirse</button>
          <button id="refreshWallet" class="actionBtn">Saldo</button>
          <div class="wallet"><span>F-coin</span><b id="wallet">...</b></div>
        </div>

        <div class="betPanel">
          <div id="numGrid" class="numGrid"></div>
          <div id="outside" class="outside"></div>
        </div>

        <div class="controls">
          <button class="chip" data-chip="10">10</button>
          <button class="chip active" data-chip="25">25</button>
          <button class="chip" data-chip="50">50</button>
          <button class="chip" data-chip="100">100</button>
          <button class="chip" data-chip="250">250</button>
          <button class="chip" data-chip="500">500</button>
          <button id="spin" class="spin">GIRAR</button>
          <button id="repeat" class="ghost">Repetir</button>
        </div>
      </section>

      <aside class="side">
        <section class="sideCard">
          <div class="sideHead"><h2>SALA</h2><span id="roomName">Sin sala</span></div>
          <div class="metric"><span>Estado</span><b id="status" class="status">...</b></div>
          <div class="metric"><span>Jugadores conectados</span><b id="players">1</b></div>
          <div class="metric"><span>Giros de la sesion</span><b id="spinCount">0</b></div>
        </section>

        <section class="sideCard">
          <div class="sideHead"><h2>NUMEROS</h2><span>Sesion actual</span></div>
          <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;font-weight:900">Mas repetidos</p>
          <div id="hot" class="heat"></div>
          <p style="margin:12px 0 8px;color:#9ca3af;font-size:12px;font-weight:900">Menos vistos</p>
          <div id="cold" class="heat"></div>
        </section>

        <section class="sideCard">
          <div class="sideHead"><h2>RESULTADOS</h2><span id="net" class="pos">+0</span></div>
          <table>
            <thead><tr><th>Giro</th><th>Apuesta</th><th>Pago</th><th>Neto</th></tr></thead>
            <tbody id="results"></tbody>
          </table>
        </section>
      </aside>
    </main>
  </div>

  <script src="/games/realtime-room.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const profile = {
      userId: params.get("userId") || "",
      displayName: params.get("displayName") || "Jugador",
      avatarUrl: params.get("avatarUrl") || ""
    };
    const numbers = ["00",3,6,9,12,15,18,21,24,27,30,33,36,2,5,8,11,14,17,20,23,26,29,32,35,0,1,4,7,10,13,16,19,22,25,28,31,34];
    const red = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    const $ = (id) => document.getElementById(id);
    const color = (n) => (n === 0 || n === "00") ? "green" : red.has(Number(n)) ? "red" : "black";
    let api, connected = false, rotation = 0, ballRotation = 0, chip = 25, wallet = null, net = 0, busy = false;
    let players = 1, lastBet = null, selected = { type: "number", value: 36, label: "36" };
    const spins = [];
    const preset = (params.get("room") || "").toUpperCase();
    if (preset) $("room").value = preset;

    function fmt(value) {
      if (value === null || value === undefined) return "...";
      return Number(value || 0).toLocaleString("es-CL");
    }

    function setStatus(text) {
      $("status").textContent = text;
    }

    function renderWallet(next) {
      if (typeof next === "number") wallet = next;
      $("wallet").textContent = fmt(wallet);
    }

    function updateBetText() {
      $("betLabel").textContent = selected.label;
      $("betAmount").textContent = fmt(chip);
    }

    function renderHeat() {
      const counts = new Map(numbers.map((n) => [String(n), 0]));
      spins.forEach((n) => counts.set(String(n), (counts.get(String(n)) || 0) + 1));
      const ranked = [...counts.entries()].sort((a,b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
      const hot = ranked.filter((x) => x[1] > 0).slice(0, 3);
      const cold = ranked.slice(-3).reverse();
      $("hot").innerHTML = (hot.length ? hot : [["--", 0]]).map(([n,c]) => `<span class="pill ${color(n)}">${n} ${c}x</span>`).join("");
      $("cold").innerHTML = cold.map(([n,c]) => `<span class="pill ${color(n)}">${n} ${c}x</span>`).join("");
      $("spinCount").textContent = String(spins.length);
      $("players").textContent = String(players);
    }

    function select(type, value, label, el) {
      document.querySelectorAll(".selected").forEach((node) => node.classList.remove("selected"));
      el?.classList.add("selected");
      selected = { type, value, label };
      updateBetText();
    }

    function renderTable() {
      const numGrid = $("numGrid");
      const outside = $("outside");
      numGrid.innerHTML = "";
      outside.innerHTML = "";
      numbers.forEach((n) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `cell ${color(n)}${n === "00" ? " zeroA" : ""}${n === 0 ? " zeroB" : ""}${String(n) === "36" ? " selected" : ""}`;
        btn.textContent = n;
        btn.onclick = () => select("number", n, String(n), btn);
        numGrid.appendChild(btn);
      });
      [["side","2:1"],["outside","1-18"],["outside","PAR"],["outside","ROJO"],["outside","NEGRO"],["outside","IMPAR"],["outside","19-36"],["side","2:1"]].forEach(([type,label]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `cell ${type === "side" ? "sidePay" : "out"} ${label === "ROJO" ? "red" : label === "NEGRO" ? "black" : ""}`;
        btn.textContent = label;
        if (type !== "side") btn.onclick = () => select("outside", label, label, btn);
        outside.appendChild(btn);
      });
    }

    function renderWheelNumbers() {
      const wheel = $("wheel");
      const rotor = $("rotor");
      rotor.querySelectorAll(".wheelNumber").forEach((node) => node.remove());
      const radius = wheel.clientWidth * 0.365;
      numbers.forEach((n, index) => {
        const label = document.createElement("span");
        const angle = index * (360 / numbers.length);
        label.className = "wheelNumber";
        label.textContent = n;
        label.style.transform = `rotate(${angle}deg) translateY(-${radius}px)`;
        rotor.appendChild(label);
      });
    }

    function wins(result, bet) {
      const n = Number(result);
      if (bet.type === "number") return String(result) === String(bet.value);
      if (bet.value === "ROJO") return color(result) === "red";
      if (bet.value === "NEGRO") return color(result) === "black";
      if (bet.value === "PAR") return n > 0 && n % 2 === 0;
      if (bet.value === "IMPAR") return n > 0 && n % 2 === 1;
      if (bet.value === "1-18") return n >= 1 && n <= 18;
      if (bet.value === "19-36") return n >= 19 && n <= 36;
      return false;
    }

    function spinResult() {
      return numbers[Math.floor(Math.random() * numbers.length)];
    }

    function paintResult(result, bet, payout, delta) {
      spins.push(result);
      renderHeat();
      $("last").textContent = result;
      $("last").style.background = color(result) === "green" ? "#0b8d42" : color(result) === "red" ? "#c8171d" : "#111318";
      net += delta;
      $("net").textContent = `${net >= 0 ? "+" : ""}${fmt(net)}`;
      $("net").className = net >= 0 ? "pos" : "neg";
      $("results").insertAdjacentHTML("afterbegin", `
        <tr>
          <td><span class="pill ${color(result)}">${result}</span></td>
          <td>${bet.label} / ${fmt(bet.amount)}</td>
          <td>${fmt(payout)}</td>
          <td class="${delta >= 0 ? "pos" : "neg"}">${delta >= 0 ? "+" : ""}${fmt(delta)}</td>
        </tr>
      `);
    }

    async function refreshWallet() {
      if (!api?.getWallet) return;
      const result = await api.getWallet();
      if (typeof result.balance === "number") renderWallet(result.balance);
    }

    async function spin(local, payload) {
      if (busy) return;
      if (!local && !connected) {
        setStatus("Crea o unete a una sala antes de girar.");
        return;
      }
      busy = true;
      const bet = !local && payload?.bet ? payload.bet : { ...selected, amount: chip };
      const result = payload?.result ?? spinResult();
      lastBet = bet;
      const resultIndex = numbers.indexOf(result);
      const pocketAngle = resultIndex * (360 / numbers.length);
      rotation += 1440 - pocketAngle;
      ballRotation += 1080;
      $("rotor").style.transform = `rotate(${rotation}deg)`;
      $("ball").style.transform = `translate(-50%,-50%) rotate(${ballRotation}deg) translateY(-${Math.max(72, $("wheel").clientWidth * 0.36)}px)`;
      const won = wins(result, bet);
      const multiplier = bet.type === "number" ? 36 : 2;
      const payout = won ? bet.amount * multiplier : 0;
      const delta = payout - bet.amount;
      window.setTimeout(async () => {
        paintResult(result, bet, payout, delta);
        if (!local) api.send("spin", { result });
        if (connected) {
          const settled = await api.casinoWager("casino-roulette", bet.amount, payout, { bet, result, source: local ? "shared_spin" : "own_spin" });
          if (typeof settled.wallet_balance === "number") renderWallet(settled.wallet_balance);
          if (settled.reason && settled.reason !== "ok") setStatus(`Wallet: ${settled.reason}`);
          else setStatus(`Sala ${api.room} / ${won ? "ganaste" : "sin premio"}`);
        }
        busy = false;
      }, 650);
    }

    async function connect(room) {
      const code = String(room || "").trim().toUpperCase();
      if (!code) return;
      await api.connect(code);
      connected = true;
      $("room").value = code;
      $("roomName").textContent = code;
      setStatus(`Sala ${code}`);
      await refreshWallet();
    }

    async function setup() {
      renderTable();
      renderWheelNumbers();
      renderHeat();
      updateBetText();
      window.addEventListener("resize", renderWheelNumbers);
      document.querySelectorAll(".chip").forEach((btn) => {
        btn.onclick = () => {
          document.querySelectorAll(".chip").forEach((node) => node.classList.remove("active"));
          btn.classList.add("active");
          chip = Number(btn.dataset.chip || 25);
          updateBetText();
        };
      });
      try {
        api = await createRealtimeRoom({
          game: "casino-roulette",
          profile,
          onPeers: (count) => { players = count || 1; renderHeat(); },
          onMessage: (message) => {
            if (message.type === "spin") spin(true, message.payload);
            if (message.type === "wager") setStatus(`${message.payload.displayName} aposto ${fmt(message.payload.bet)} F-coin`);
          }
        });
        setStatus("Listo para crear sala.");
        await refreshWallet();
        if (preset) connect(preset);
      } catch (error) {
        setStatus(error.message || "Realtime no disponible.");
      }
    }

    $("create").onclick = () => connect($("room").value || Math.random().toString(36).slice(2, 8).toUpperCase());
    $("join").onclick = () => connect($("room").value);
    $("refreshWallet").onclick = refreshWallet;
    $("spin").onclick = () => spin(false);
    $("repeat").onclick = () => { if (lastBet) spin(false, { bet: lastBet, result: spinResult() }); };
    setup();
  </script>
</body>
</html>
