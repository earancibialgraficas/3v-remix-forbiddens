<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ruleta Retro</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080910;color:#f8fafc;font-family:Inter,Arial,sans-serif;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{min-height:32px;border:1px solid #334155;border-radius:8px;background:#111827;color:#fff;padding:7px 10px;font-size:12px}button{cursor:pointer;background:#991b1b;border-color:#facc15;font-weight:900}.status{margin-left:auto;color:#67e8f9;font-size:12px}.table{min-height:0;display:grid;grid-template-columns:minmax(260px,1fr) 280px;gap:14px}.wheelWrap{display:flex;align-items:center;justify-content:center;border:2px solid #d6b16f;background:#12351f;border-radius:14px;position:relative}.wheel{width:min(62vmin,460px);aspect-ratio:1;border-radius:50%;border:10px solid #facc15;background:conic-gradient(#0f766e 0 9.73deg,#111827 9.73deg 19.46deg,#b91c1c 19.46deg 29.19deg,#111827 29.19deg 38.92deg,#b91c1c 38.92deg 48.65deg,#111827 48.65deg 58.38deg,#b91c1c 58.38deg 68.11deg,#111827 68.11deg 77.84deg,#b91c1c 77.84deg 87.57deg,#111827 87.57deg 97.3deg,#b91c1c 97.3deg 107.03deg,#111827 107.03deg 116.76deg,#b91c1c 116.76deg 126.49deg,#111827 126.49deg 136.22deg,#b91c1c 136.22deg 145.95deg,#111827 145.95deg 155.68deg,#b91c1c 155.68deg 165.41deg,#111827 165.41deg 175.14deg,#b91c1c 175.14deg 184.87deg,#111827 184.87deg 194.6deg,#b91c1c 194.6deg 204.33deg,#111827 204.33deg 214.06deg,#b91c1c 214.06deg 223.79deg,#111827 223.79deg 233.52deg,#b91c1c 233.52deg 243.25deg,#111827 243.25deg 252.98deg,#b91c1c 252.98deg 262.71deg,#111827 262.71deg 272.44deg,#b91c1c 272.44deg 282.17deg,#111827 282.17deg 291.9deg,#b91c1c 291.9deg 301.63deg,#111827 301.63deg 311.36deg,#b91c1c 311.36deg 321.09deg,#111827 321.09deg 330.82deg,#b91c1c 330.82deg 340.55deg,#111827 340.55deg 350.28deg,#b91c1c 350.28deg 360deg);transition:transform 3s cubic-bezier(.12,.8,.18,1)}.pin{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #fff}.panel{border:1px solid #334155;border-radius:12px;background:#020617;padding:12px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.num{min-height:34px;background:#111827}.green{background:#0f766e}.red{background:#991b1b}.black{background:#020617}.log{font-size:12px;color:#cbd5e1;margin-top:12px;line-height:1.5}@media(max-width:760px){.table{grid-template-columns:1fr;grid-template-rows:1fr auto}.status{margin-left:0}.panel{max-height:260px}}@media(max-width:430px){.bar{display:grid;grid-template-columns:1fr 1fr}.status{grid-column:1/-1;text-align:center}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="bar"><button id="create">Crear</button><input id="room" placeholder="Codigo"/><button id="join">Unirse</button><input id="bet" type="number" min="1" value="25"/><select id="choice"><option value="red">Rojo x2</option><option value="black">Negro x2</option><option value="green">Cero x14</option></select><button id="spin">Girar</button><span class="status" id="status">Conectando...</span></div><main class="table"><section class="wheelWrap"><div class="pin"></div><div class="wheel" id="wheel"></div></section><aside class="panel"><h1>Ruleta Retro</h1><div class="grid" id="nums"></div><div class="log" id="log">Crea una sala y apuesta F-coin.</div></aside></main><script src="/games/realtime-room.js"></script><script>
const p=new URLSearchParams(location.search),profile={userId:p.get('userId')||'',displayName:p.get('displayName')||'Jugador',avatarUrl:p.get('avatarUrl')||''};const roomEl=document.getElementById('room'),statusEl=document.getElementById('status'),logEl=document.getElementById('log'),wheel=document.getElementById('wheel');let api,connected=false,rotation=0;const preset=(p.get('room')||'').toUpperCase();if(preset)roomEl.value=preset;const colors=n=>n===0?'green':n%2?'red':'black';document.getElementById('nums').innerHTML=Array.from({length:37},(_,n)=>`<button class="num ${colors(n)}">${n}</button>`).join('');
function status(t){statusEl.textContent=t}async function connect(room){await api.connect(room);connected=true;roomEl.value=room;status('Sala '+room)}function result(){const n=Math.floor(Math.random()*37);return{n,color:colors(n)}}async function spin(local){if(!connected)return;const bet=Math.max(1,Number(document.getElementById('bet').value)||1),pick=document.getElementById('choice').value,r=result();rotation+=1440+(360-r.n*9.73);wheel.style.transform=`rotate(${rotation}deg)`;const win=pick===r.color;const payout=win?Math.floor(bet*(pick==='green'?14:2)):0;logEl.textContent=`Resultado ${r.n} ${r.color}. ${win?'Ganaste':'Perdiste'} ${payout} F-coin.`;if(!local){api.send('spin',{r,bet,pick,payout});const settled=await api.casinoWager('casino-roulette',bet,payout,{pick,result:r});if(settled.reason&&settled.awarded===0)logEl.textContent+=' Wallet pendiente: '+settled.reason;}}async function setup(){try{api=await createRealtimeRoom({game:'casino-roulette',profile,onMessage:m=>{if(m.type==='spin')spin(true);if(m.type==='wager')status(`${m.payload.displayName} aposto ${m.payload.bet}`)}});status('Listo');if(preset)connect(preset)}catch(e){status(e.message||'Sin realtime')}}document.getElementById('create').onclick=()=>connect(roomEl.value.trim().toUpperCase()||Math.random().toString(36).slice(2,8).toUpperCase());document.getElementById('join').onclick=()=>connect(roomEl.value.trim().toUpperCase());document.getElementById('spin').onclick=()=>spin(false);setup();
</script></body></html>
