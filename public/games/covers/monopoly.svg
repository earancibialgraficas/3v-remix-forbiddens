<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Monopolio Arcade</title>
  <desc id="desc">Retro multiplayer board game cover with neon properties and dice.</desc>
  <defs>
