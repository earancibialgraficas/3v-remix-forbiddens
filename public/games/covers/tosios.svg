<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">TOSIOS</title>
  <desc id="desc">Top-down multiplayer shooter cover with pixel dungeon arena.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <g opacity=".32">
    <path d="M0 72h640M0 144h640M0 216h640M0 288h640M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <g>
    <rect x="60" y="94" width="122" height="54" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
    <rect x="454" y="208" width="132" height="58" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
    <rect x="246" y="42" width="52" height="122" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <rect x="336" y="210" width="58" height="100" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="248" cy="214" r="28" fill="#22c55e" stroke="#bbf7d0" stroke-width="5"/>
    <path d="M248 214 328 178" stroke="#bbf7d0" stroke-width="11" stroke-linecap="round"/>
    <path d="M326 178h76" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
    <circle cx="432" cy="132" r="28" fill="#ef4444" stroke="#fecaca" stroke-width="5"/>
    <path d="M432 132 368 170" stroke="#fecaca" stroke-width="11" stroke-linecap="round"/>
    <path d="M366 170h-68" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="503" cy="91" r="18" fill="#a78bfa" stroke="#ede9fe" stroke-width="4"/>
    <circle cx="146" cy="254" r="18" fill="#f97316" stroke="#ffedd5" stroke-width="4"/>
  </g>
  <g fill="#facc15" opacity=".9">
    <circle cx="345" cy="170" r="5"/>
    <circle cx="384" cy="178" r="4"/>
    <circle cx="306" cy="176" r="4"/>
  </g>
  <text x="32" y="58" fill="#f8fafc" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900">TOSIOS</text>
