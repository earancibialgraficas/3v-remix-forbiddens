<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Voidstrike</title>
  <desc id="desc">Sci-fi RTS cover with neon battlefield and command ships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".45" stop-color="#0c1934"/>
      <stop offset="1" stop-color="#10071f"/>
    </linearGradient>
    <radialGradient id="rift" cx=".5" cy=".36" r=".48">
