<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Blackjack Drag">
  <rect width="512" height="512" fill="#07040f"/>
  <rect x="44" y="66" width="424" height="380" rx="16" fill="#17351f" stroke="#d6b16f" stroke-width="8"/>
  <g transform="rotate(-12 206 248)">
    <rect x="132" y="122" width="136" height="190" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="6"/>
    <text x="200" y="204" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#b91c1c">A</text>
    <text x="200" y="264" text-anchor="middle" font-family="Arial" font-size="44" fill="#b91c1c">♥</text>
  </g>
  <g transform="rotate(13 302 260)">
    <rect x="244" y="146" width="136" height="190" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="6"/>
    <text x="312" y="228" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#111827">K</text>
    <text x="312" y="288" text-anchor="middle" font-family="Arial" font-size="44" fill="#111827">♠</text>
  </g>
  <text x="256" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#67e8f9">BLACKJACK</text>
  <text x="256" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="900" fill="#facc15">DRAG & DROP</text>
</svg>
