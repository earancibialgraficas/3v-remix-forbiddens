<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ajedrez con Apuesta</title><style>html,body{height:100%;margin:0;background:#071014;color:#fff;font-family:Inter,Arial;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}button,input{min-height:32px;border:1px solid #334155;border-radius:8px;background:#111827;color:#fff;padding:7px 10px}button{background:#0f766e;border-color:#2dd4bf;font-weight:900}.bar{display:flex;gap:8px;flex-wrap:wrap}.status{margin-left:auto;color:#facc15}.board{aspect-ratio:1;max-height:100%;max-width:100%;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #2dd4bf}.sq{display:grid;place-items:center;font-size:min(8vmin,54px)}.l{background:#d7f7ee;color:#111}.d{background:#168071;color:#111}.panel{position:absolute;right:12px;bottom:12px;background:#020617dd;border:1px solid #334155;border-radius:12px;padding:12px;font-size:12px}@media(max-width:560px){.status{margin-left:0}.panel{position:static}.sq{font-size:9vmin}}</style></head><body><div class="bar"><button id="create">Crear</button><input id="room" placeholder="Codigo"/><button id="join">Unirse</button><input id="bet" type="number" value="50" min="1"/><button id="win">Declarar victoria</button><span id="status" class="status">Conectando...</span></div><main class="board" id="board"></main><aside class="panel" id="log">Usa esta mesa para pactar una partida con apuesta. El ajedrez completo sigue disponible en Ajedrez Arcade.</aside><script src="/games/realtime-room.js"></script><script>
const p=new URLSearchParams(location.search),profile={userId:p.get('userId')||'',displayName:p.get('displayName')||'Jugador',avatarUrl:p.get('avatarUrl')||''};let api,connected=false;const roomEl=room,statusEl=status,preset=(p.get('room')||'').toUpperCase();if(preset)roomEl.value=preset;const pieces='♜♞♝♛♚♝♞♜♟♟♟♟♟♟♟♟                                ♙♙♙♙♙♙♙♙♖♘♗♕♔♗♘♖';board.innerHTML=Array.from({length:64},(_,i)=>`<div class="sq ${((Math.floor(i/8)+i)%2)?'d':'l'}">${pieces[i]||''}</div>`).join('');async function connect(r){await api.connect(r);connected=true;roomEl.value=r;statusEl.textContent='Sala '+r}async function settle(){const bet=Number(document.getElementById('bet').value)||1;const r=await api.casinoWager('casino-chess',bet,bet*2,{declared:'manual'});log.textContent='Victoria declarada. '+(r.reason&&r.awarded===0?'Wallet pendiente: '+r.reason:'Payout enviado.');api.send('chess-win',{bet})}async function setup(){try{api=await createRealtimeRoom({game:'casino-chess',profile,onMessage:m=>{if(m.type==='chess-win')statusEl.textContent='Victoria registrada en sala'}});statusEl.textContent='Listo';if(preset)connect(preset)}catch(e){statusEl.textContent=e.message||'Sin realtime'}}create.onclick=()=>connect(roomEl.value.trim().toUpperCase()||Math.random().toString(36).slice(2,8).toUpperCase());join.onclick=()=>connect(roomEl.value.trim().toUpperCase());win.onclick=settle;setup();
</script></body></html>
