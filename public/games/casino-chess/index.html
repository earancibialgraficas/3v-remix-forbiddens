<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ajedrez Bet</title>
  <style>
    *{box-sizing:border-box;scrollbar-color:#67e8f9 #05070d;scrollbar-width:thin}html,body{height:100%;margin:0;background:#05070d;color:#f8fafc;font-family:Inter,Arial,sans-serif;overflow:hidden}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:#05070d;border-left:1px solid #1f2937}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#67e8f9,#2dd4bf);border:2px solid #05070d;border-radius:999px;box-shadow:0 0 12px #67e8f966}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px;background:radial-gradient(circle at 45% 10%,#153a35 0,#05070d 45%,#02030a 100%)}
    body.embedded{grid-template-rows:minmax(0,1fr);gap:0;padding:0}
    body.embedded{grid-template-rows:minmax(0,1fr)}
    body.embedded .controls{display:none}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
    input,button{min-height:30px;border-radius:7px;border:1px solid #334155;background:#111827;color:#f8fafc;padding:6px 9px;font:inherit;font-size:12px;box-shadow:inset 0 0 12px #0006}
    button{cursor:pointer;background:#0f766e;border-color:#2dd4bf;font-weight:900;box-shadow:0 0 16px #2dd4bf24}button:disabled{opacity:.45;cursor:not-allowed}
    input{min-width:90px;flex:0 1 120px}.status{margin-left:auto;color:#67e8f9;font-size:12px;white-space:nowrap}
    .shell{--board-size:min(calc(100vh - 16px),calc((100vw - 34px)/1.5));--panel-size:calc(var(--board-size)/2);width:min(100%,calc(var(--board-size) + var(--panel-size) + 10px));height:var(--board-size);min-height:0;justify-self:center;align-self:center;display:grid;grid-template-columns:var(--board-size) var(--panel-size);gap:10px;align-items:stretch;container-type:size}
    .board{width:var(--board-size);height:var(--board-size);max-width:100%;max-height:100%;aspect-ratio:1;border:2px solid #14b8a6;box-shadow:0 0 34px #14b8a655,0 22px 60px #0009;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden;border-radius:10px;background:#0f172a;align-self:center;justify-self:center}
    .sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6.5vmin,58px);cursor:pointer;position:relative;transition:filter .16s ease,box-shadow .16s ease}.sq:hover{filter:brightness(1.08)}
    .light{background:#cfe0d8}.dark{background:#126b61}.selected{outline:4px solid #facc15;outline-offset:-4px;box-shadow:inset 0 0 22px #facc1588}.move::after{content:"";width:22%;height:22%;border-radius:999px;background:#facc15aa;position:absolute}.last{box-shadow:inset 0 0 24px #39ff14aa}
    .piece{font-family:"Segoe UI Symbol","DejaVu Sans",serif;font-weight:900;line-height:1;text-shadow:none;filter:none}.white{color:#ef4444}.black{color:#0f172a}
    .panel{height:var(--board-size);min-height:0;max-height:var(--board-size);border:1px solid #334155;border-radius:10px;background:#020617d9;padding:10px;overflow:auto;overscroll-behavior:contain;box-shadow:0 18px 48px #0009,0 0 24px #2dd4bf14}h1{font-size:12px;margin:0 0 8px;color:#2dd4bf;text-transform:uppercase;letter-spacing:.08em}.meta{font-size:11px;color:#cbd5e1;line-height:1.5}.role{font-size:16px;font-weight:900;color:#facc15;margin:10px 0}.pot{border:1px solid #facc1540;border-radius:8px;background:#facc1510;padding:8px;margin:8px 0;box-shadow:inset 0 0 18px #facc1512}.moves{margin-top:8px;max-height:none;overflow:visible;border-top:1px solid #1e293b;padding-top:7px;font-size:11px;color:#94a3b8}
    @media(max-width:760px){.shell{--board-size:min(100vw - 16px,calc(100vh - 132px));width:min(100%,var(--board-size));height:100%;grid-template-columns:1fr;grid-template-rows:var(--board-size) minmax(96px,1fr);gap:8px}.panel{height:auto;max-height:none}.sq{font-size:clamp(20px,9vmin,48px)}.status{margin-left:0}}
    @media(max-width:430px){body{gap:8px;padding:8px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.controls button,.controls input{width:100%;min-width:0}.status{grid-column:1/-1;text-align:center}.panel{padding:10px}.moves{display:none}}
  </style>
</head>
<body>
  <div class="controls">
    <button id="create">Crear sala</button><input id="room" maxlength="12" placeholder="Codigo" /><button id="join">Unirse</button>
    <input id="bet" type="number" min="1" max="1000" value="50" /><button id="reset">Reiniciar</button><button id="win">Declarar victoria</button><span id="status" class="status">Conectando...</span>
  </div>
  <main class="shell">
    <section class="board" id="board"></section>
    <aside class="panel">
      <h1>Ajedrez Bet</h1>
      <div class="meta" id="roomInfo">Crea una sala o usa el codigo de un amigo.</div>
      <div class="role" id="roleInfo">Sin sala</div>
      <div class="pot">Pozo: <b id="pot">0</b> F-coin<br/>Casa: +10% al ganador</div>
      <div class="meta" id="turnInfo">Mesa visual estilo Ajedrez Arcade. Las apuestas se liquidan en F-coin.</div>
      <div class="moves" id="moves"></div>
    </aside>
  </main>
  <script src="/games/realtime-room.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const preset = (params.get('room') || '').toUpperCase();
    const shouldHost = params.get('host') === '1';
    document.body.classList.toggle('embedded', params.get('embed') === '1');
    const profile = { userId: params.get('userId') || '', displayName: params.get('displayName') || 'Jugador', avatarUrl: params.get('avatarUrl') || '' };
    const roomInput = document.getElementById('room'), statusEl = document.getElementById('status'), boardEl = document.getElementById('board'), movesEl = document.getElementById('moves');
    if (preset) roomInput.value = preset;
    const MAX_BET = 1000;
    const glyphs = {
      white: { k: '&#9812;', q: '&#9813;', r: '&#9814;', b: '&#9815;', n: '&#9816;', p: '&#9817;' },
      black: { k: '&#9818;', q: '&#9819;', r: '&#9820;', b: '&#9821;', n: '&#9822;', p: '&#9823;' },
    };
    let api, connected = false, role = shouldHost ? 'white' : 'black', selected = -1, last = -1, pot = 0, turn = 'white', gameOver = false;
    let board = startBoard();

    function getBet() {
      const input = document.getElementById('bet');
      const value = Math.min(MAX_BET, Math.max(1, Math.floor(Number(input.value) || 1)));
      input.value = String(value);
      return value;
    }
    function startBoard() {
      const back = ['r','n','b','q','k','b','n','r'];
      return [
        ...back.map((type) => ({ type, color: 'black' })),
        ...Array.from({ length: 8 }, () => ({ type: 'p', color: 'black' })),
        ...Array.from({ length: 32 }, () => null),
        ...Array.from({ length: 8 }, () => ({ type: 'p', color: 'white' })),
        ...back.map((type) => ({ type, color: 'white' })),
      ];
    }
    function row(i) { return Math.floor(i / 8); }
    function col(i) { return i % 8; }
    function inside(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
    function idx(r, c) { return r * 8 + c; }
    function squareName(i) { return `${'abcdefgh'[col(i)]}${8 - row(i)}`; }
    function boardIndexForView(viewIndex) {
      if (role !== 'black') return viewIndex;
      return idx(7 - row(viewIndex), 7 - col(viewIndex));
    }
    function cloneBoard(src = board) { return src.map((p) => p ? { ...p } : null); }
    function opponent(color) { return color === 'white' ? 'black' : 'white'; }
    function pathClear(from, to, b = board) {
      const dr = Math.sign(row(to) - row(from));
      const dc = Math.sign(col(to) - col(from));
      let r = row(from) + dr, c = col(from) + dc;
      while (r !== row(to) || c !== col(to)) {
        if (b[idx(r, c)]) return false;
        r += dr; c += dc;
      }
      return true;
    }
    function attacksSquare(from, to, b = board) {
      const piece = b[from];
      if (!piece) return false;
      const fr = row(from), fc = col(from), tr = row(to), tc = col(to);
      const dr = tr - fr, dc = tc - fc;
      const adr = Math.abs(dr), adc = Math.abs(dc);
      if (piece.type === 'p') {
        const dir = piece.color === 'white' ? -1 : 1;
        return dr === dir && adc === 1;
      }
      if (piece.type === 'n') return (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
      if (piece.type === 'b') return adr === adc && pathClear(from, to, b);
      if (piece.type === 'r') return (dr === 0 || dc === 0) && pathClear(from, to, b);
      if (piece.type === 'q') return ((adr === adc) || dr === 0 || dc === 0) && pathClear(from, to, b);
      if (piece.type === 'k') return Math.max(adr, adc) === 1;
      return false;
    }
    function kingIndex(color, b = board) {
      return b.findIndex((p) => p?.type === 'k' && p.color === color);
    }
    function inCheck(color, b = board) {
      const king = kingIndex(color, b);
      if (king < 0) return true;
      return b.some((p, i) => p?.color === opponent(color) && attacksSquare(i, king, b));
    }
    function canMoveRaw(from, to, b = board) {
      const piece = b[from], target = b[to];
      if (!piece || from === to || target?.color === piece.color) return false;
      const fr = row(from), fc = col(from), tr = row(to), tc = col(to);
      const dr = tr - fr, dc = tc - fc, adr = Math.abs(dr), adc = Math.abs(dc);
      if (piece.type === 'p') {
        const dir = piece.color === 'white' ? -1 : 1;
        const start = piece.color === 'white' ? 6 : 1;
        if (dc === 0 && dr === dir && !target) return true;
        if (dc === 0 && fr === start && dr === dir * 2 && !target && !b[idx(fr + dir, fc)]) return true;
        return adc === 1 && dr === dir && Boolean(target && target.color !== piece.color);
      }
      if (piece.type === 'n') return (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
      if (piece.type === 'b') return adr === adc && pathClear(from, to, b);
      if (piece.type === 'r') return (dr === 0 || dc === 0) && pathClear(from, to, b);
      if (piece.type === 'q') return ((adr === adc) || dr === 0 || dc === 0) && pathClear(from, to, b);
      if (piece.type === 'k') return Math.max(adr, adc) === 1;
      return false;
    }
    function legalMove(from, to, b = board) {
      const piece = b[from];
      if (!canMoveRaw(from, to, b)) return false;
      const next = cloneBoard(b);
      next[to] = { ...piece };
      next[from] = null;
      if (next[to].type === 'p' && (row(to) === 0 || row(to) === 7)) next[to].type = 'q';
      return !inCheck(piece.color, next);
    }
    function legalTargets(from) {
      return board.map((_, i) => i).filter((to) => legalMove(from, to));
    }
    function hasAnyLegalMove(color) {
      return board.some((p, from) => p?.color === color && legalTargets(from).length > 0);
    }
    function updateInfo() {
      const check = inCheck(turn);
      const noMoves = !hasAnyLegalMove(turn);
      if (noMoves) {
        gameOver = true;
        turnInfo.textContent = check ? `Jaque mate. Ganan ${opponent(turn) === 'white' ? 'blancas' : 'negras'}.` : 'Tablas por ahogado.';
      } else {
        turnInfo.textContent = `${turn === 'white' ? 'Blancas' : 'Negras'} juegan${check ? ' / jaque' : ''}.`;
      }
      roleInfo.textContent = role === 'white' ? 'Blancas' : 'Negras';
    }
    function render() {
      const targets = selected >= 0 ? new Set(legalTargets(selected)) : new Set();
      boardEl.innerHTML = '';
      for (let viewIndex = 0; viewIndex < 64; viewIndex += 1) {
        const i = boardIndexForView(viewIndex);
        const piece = board[i];
        const sq = document.createElement('button');
        sq.className = 'sq ' + (((row(viewIndex) + viewIndex) % 2) ? 'dark' : 'light') + (selected === i ? ' selected' : '') + (last === i ? ' last' : '') + (targets.has(i) ? ' move' : '');
        sq.onclick = () => clickSq(i);
        sq.innerHTML = piece ? `<span class="piece ${piece.color}">${glyphs[piece.color][piece.type]}</span>` : '';
        boardEl.appendChild(sq);
      }
      updateInfo();
    }
    function addMoveLog(text) {
      movesEl.insertAdjacentHTML('afterbegin', `<div>${text}</div>`);
    }
    function makeMove(from, to, remote = false, name = profile.displayName) {
      const piece = board[from];
      const captured = board[to];
      board[to] = { ...piece };
      board[from] = null;
      if (board[to].type === 'p' && (row(to) === 0 || row(to) === 7)) board[to].type = 'q';
      last = to;
      selected = -1;
      const notation = `${squareName(from)} -> ${squareName(to)}${captured ? ' x' : ''}${board[to].type === 'q' && piece.type === 'p' ? ' =D' : ''}`;
      addMoveLog(`${name || 'Jugador'}: ${notation}`);
      turn = opponent(turn);
      if (!remote) api?.send('move', { from, to, name: profile.displayName });
      render();
      if (gameOver && inCheck(turn) && !remote && board[to]?.color === role) settle('checkmate');
    }
    function clickSq(i) {
      if (gameOver) return;
      const piece = board[i];
      if (selected < 0) {
        if (!piece) return;
        if (piece.color !== role) { statusEl.textContent = 'Solo puedes mover tus piezas.'; return; }
        if (piece.color !== turn) { statusEl.textContent = 'Espera tu turno.'; return; }
        selected = i; render(); return;
      }
      if (selected === i) { selected = -1; render(); return; }
      if (piece?.color === board[selected]?.color) { selected = i; render(); return; }
      if (!legalMove(selected, i)) { statusEl.textContent = 'Movimiento ilegal.'; return; }
      makeMove(selected, i);
    }
    function applyMove(m) {
      if (!Number.isInteger(m?.from) || !Number.isInteger(m?.to)) return;
      if (!legalMove(m.from, m.to)) { addMoveLog('Movimiento remoto rechazado por ilegal.'); return; }
      makeMove(m.from, m.to, true, m.name || 'Rival');
    }
    async function connect(room) {
      const code = String(room || '').trim().toUpperCase();
      if (!code) return;
      await api.connect(code);
      connected = true;
      roomInput.value = code;
      statusEl.textContent = 'Sala ' + code;
      placeBet();
      render();
    }
    async function placeBet() {
      const bet = getBet();
      pot += bet;
      document.getElementById('pot').textContent = pot.toLocaleString('es-CL');
      api?.send('bet', { bet, name: profile.displayName });
    }
    async function settle(reason = 'manual') {
      if (!connected || gameOver && reason === 'manual') return;
      const bet = getBet(), payout = Math.floor((pot || bet) * 1.1);
      const r = await api.casinoWager('casino-chess', bet, payout, { pot, declared: reason, winnerColor: role });
      addMoveLog(`Victoria declarada. ${r.reason && r.reason !== 'ok' ? 'Wallet pendiente: ' + r.reason : 'Ganancia neta ' + (payout - bet).toLocaleString('es-CL') + ' F-coin'}`);
      api.send('chess-win', { name: profile.displayName, payout, winnerColor: role });
      gameOver = true;
      render();
    }
    async function loseStake(winner) {
      if (gameOver) return;
      gameOver = true;
      const bet = getBet();
      const r = await api.casinoWager('casino-chess', bet, 0, { lostTo: winner || 'rival' });
      addMoveLog(`${winner || 'Rival'} gano. ${r.reason && r.reason !== 'ok' ? 'Wallet: ' + r.reason : 'Perdiste ' + bet.toLocaleString('es-CL') + ' F-coin'}`);
      render();
    }
    function resetBoard(local = false) {
      selected = -1; last = -1; turn = 'white'; gameOver = false; board = startBoard();
      render();
      if (!local) api?.send('reset', {});
    }
    async function setup() {
      render();
      try {
        api = await createRealtimeRoom({
          game: 'casino-chess',
          profile,
          onMessage: (m) => {
            if (m.type === 'move') applyMove(m.payload);
            if (m.type === 'reset') resetBoard(true);
            if (m.type === 'bet') {
              pot += Number(m.payload.bet || 0);
              document.getElementById('pot').textContent = pot.toLocaleString('es-CL');
            }
            if (m.type === 'chess-win') {
              statusEl.textContent = `${m.payload.name} gano la mesa`;
              loseStake(m.payload.name);
            }
          }
        });
        statusEl.textContent = 'Listo';
        if (preset) connect(preset);
      } catch (e) {
        statusEl.textContent = e.message || 'Sin realtime';
      }
    }
    create.onclick = () => connect(roomInput.value.trim().toUpperCase() || Math.random().toString(36).slice(2, 8).toUpperCase());
    join.onclick = () => connect(roomInput.value.trim().toUpperCase());
    document.getElementById('reset').onclick = () => resetBoard();
    win.onclick = () => settle();
    setup();
  </script>
</body>
</html>
