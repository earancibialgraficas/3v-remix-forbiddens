<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PSP</title>
  <style>
    *{box-sizing:border-box}
    html,body,#game{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body{font-family:Inter,Arial,sans-serif;color:#e5faff}
    #game{position:fixed;inset:0}
    #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000}
    .loadCard{width:min(420px,calc(100vw - 32px));padding:20px;text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 14px;border-radius:999px;border:3px solid rgba(34,211,238,.18);border-top-color:#00f2fe;animation:spin .9s linear infinite}
    h1{margin:0 0 8px;font:900 13px/1 "Courier New",monospace;color:#00f2fe}
    p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}
    .bar{height:5px;margin-top:14px;border-radius:999px;background:#111827;overflow:hidden}
    .bar span{display:block;height:100%;width:8%;background:#00f2fe;transition:width .18s ease}
    .picker{margin-top:16px}
    .picker[hidden]{display:none}
    .picker input{display:none}
    .picker button{border:1px solid rgba(0,242,254,.45);background:rgba(0,242,254,.12);color:#e5faff;border-radius:999px;padding:10px 16px;font:900 11px "Courier New",monospace;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px rgba(0,242,254,.15)}
    .picker button:hover{background:rgba(0,242,254,.22)}
    .error h1{color:#fb7185}
    .error .spinner{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="loadCard" id="loadCard">
      <div class="spinner"></div>
      <h1>PSP</h1>
      <p id="message">Preparando emulador...</p>
      <div class="bar"><span id="progress"></span></div>
      <div class="picker" id="picker" hidden>
        <input id="romInput" type="file" accept=".iso,.cso,.pbp,.chd,application/octet-stream" />
        <button id="pickButton" type="button">Cargar ROM PSP</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      var fileId = params.get("file") || "";
      var romUrl = params.get("rom") || "";
      var pickLocal = params.get("pick") === "1";
      var directDrive = params.get("direct") !== "0";
      var speedMode = params.get("speed") || "fast";
      var cpuCore = params.get("cpu") || "IR JIT";
      var frameSkip = params.get("frameskip") || "";
      var lockedCpuSpeed = params.get("pspCpu") || "";
      var gameName = params.get("name") || "Juego PSP";
      var token = localStorage.getItem("drive_access_token") || "";
      var expiry = Number(localStorage.getItem("drive_token_expiry") || 0);
      var objectUrl = "";
      var loading = document.getElementById("loading");
      var loadCard = document.getElementById("loadCard");
      var message = document.getElementById("message");
      var progress = document.getElementById("progress");
      var picker = document.getElementById("picker");
      var romInput = document.getElementById("romInput");
      var pickButton = document.getElementById("pickButton");

      document.title = gameName;

      function setProgress(pct){
        progress.style.width = Math.max(8, Math.min(100, pct || 8)) + "%";
      }
      function setMessage(text, pct){
        message.textContent = text;
        if (typeof pct === "number") setProgress(pct);
      }
      function fail(text){
        loadCard.classList.add("error");
        message.textContent = text;
        setProgress(100);
      }
      function formatBytes(bytes){
        if (!Number.isFinite(bytes) || bytes <= 0) return "";
        var mb = bytes / (1024 * 1024);
        return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : mb.toFixed(0) + " MB";
      }
      function showLocalPicker(){
        document.title = "Cargar ROM PSP";
        setMessage("Selecciona una ROM PSP para iniciar.", 8);
        picker.hidden = false;
        pickButton.onclick = function(){ romInput.click(); };
        romInput.onchange = function(){
          var file = romInput.files && romInput.files[0];
          if (!file) return;
          if (objectUrl && objectUrl.startsWith("blob:")) URL.revokeObjectURL(objectUrl);
          objectUrl = URL.createObjectURL(file);
          gameName = file.name || "Juego PSP";
          document.title = gameName;
          picker.hidden = true;
          boot();
        };
      }
      function deleteDb(name){
        return new Promise(function(resolve){
          if (!window.indexedDB) return resolve();
          try {
            var req = indexedDB.deleteDatabase(name);
            req.onsuccess = req.onerror = req.onblocked = function(){ resolve(); };
          } catch (_) {
            resolve();
          }
        });
      }
      async function clearOldEmulatorCache(){
        var cacheVersion = "psp-emulatorjs-minimal-20250614";
        if (localStorage.getItem("forbiddens_psp_core_cache_version") === cacheVersion) return;
        setMessage("Limpiando cache anterior...", 6);
        await Promise.all([
          deleteDb("EmulatorJS-core"),
          deleteDb("EmulatorJS-roms"),
          deleteDb("EmulatorJS-bios"),
          deleteDb("EmulatorJS-cache")
        ]);
        localStorage.setItem("forbiddens_psp_core_cache_version", cacheVersion);
      }
      function prefetchAssets(){
        [
          "/emulatorjs-data/loader.js",
          "/emulatorjs-data/emulator.min.js",
          "/emulatorjs-data/compression/extract7z.js",
          "/emulatorjs-data/compression/extractzip.js",
          "/emulatorjs-data/cores/reports/ppsspp.json",
          "/emulatorjs-data/cores/ppsspp-thread-wasm.data",
          "/emulatorjs-data/cores/ppsspp-assets.zip"
        ].forEach(function(url){ fetch(url, { cache:"force-cache" }).catch(function(){}); });
      }
      async function fetchDriveMetadata(id){
        try {
          var response = await fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) + "?fields=name,size", {
            headers: { Authorization: "Bearer " + token }
          });
          if (!response.ok) return null;
          return response.json();
        } catch (_) {
          return null;
        }
      }
      async function readResponseBlob(response, expectedTotal){
        var total = Number(expectedTotal || response.headers.get("content-length") || 0);
        if (!response.body) return response.blob();
        var reader = response.body.getReader();
        var chunks = [];
        var received = 0;
        var lastPaint = 0;
        while (true) {
          var next = await reader.read();
          if (next.done) break;
          if (!next.value) continue;
          chunks.push(next.value);
          received += next.value.byteLength;
          var now = performance.now();
          if (now - lastPaint > 180 || received === total) {
            lastPaint = now;
            if (total) {
              var pct = Math.max(8, Math.min(96, Math.round((received / total) * 96)));
              setMessage("Descargando ROM... " + pct + "% (" + formatBytes(received) + " / " + formatBytes(total) + ")", pct);
            } else {
              setMessage("Descargando ROM... " + formatBytes(received), 18);
            }
          }
        }
        return new Blob(chunks, { type: response.headers.get("content-type") || "application/octet-stream" });
      }
      function getPspOptions(){
        var base = {
          "save-state-location": "download",
          "save-save-interval": "0",
          "rewindEnabled": "disabled",
          "fps": "hide",
          "vsync": "disabled",
          "webgl2Enabled": "enabled",
          "ppsspp_cpu_core": cpuCore,
          "ppsspp_fast_memory": "enabled",
          "ppsspp_ignore_bad_memory_access": "enabled",
          "ppsspp_io_timing_method": "Fast",
          "ppsspp_internal_resolution": "480x272",
          "ppsspp_mulitsample_level": "Disabled",
          "ppsspp_texture_scaling_level": "disabled",
          "ppsspp_texture_anisotropic_filtering": "disabled",
          "ppsspp_texture_filtering": "Auto",
          "ppsspp_gpu_hardware_transform": "enabled",
          "ppsspp_vertex_cache": "enabled",
          "ppsspp_lazy_texture_caching": "enabled",
          "ppsspp_software_skinning": "enabled",
          "ppsspp_skip_buffer_effects": "enabled",
          "ppsspp_skip_gpu_readbacks": "enabled",
          "ppsspp_lower_resolution_for_effects": "Aggressive",
          "ppsspp_spline_quality": "Low",
          "ppsspp_sound_speedhack": "enabled",
          "ppsspp_auto_frameskip": "enabled",
          "ppsspp_frameskiptype": "Number of frames",
          "ppsspp_frame_duplication": "enabled",
          "ppsspp_inflight_frames": "Up to 2"
        };
        if (lockedCpuSpeed) base.ppsspp_locked_cpu_speed = lockedCpuSpeed;
        if (speedMode === "max") {
          base.ppsspp_frameskip = frameSkip || "4";
          base.ppsspp_rendering_mode = "nonbuffered";
        } else {
          base.ppsspp_frameskip = frameSkip || "2";
          base.ppsspp_rendering_mode = "buffered";
        }
        return base;
      }
      function startPerfSampler(){
        window.__pspPerfSamples = [];
        var lastFrame = null;
        var lastTime = performance.now();
        setInterval(function(){
          try {
            var manager = window.EJS_emulator && window.EJS_emulator.gameManager;
            if (!manager || !manager.getFrameNum) return;
            var frame = manager.getFrameNum();
            var now = performance.now();
            if (lastFrame !== null) {
              var fps = ((frame - lastFrame) * 1000) / Math.max(1, now - lastTime);
              window.__pspPerfSamples.push({ t: Math.round(now), fps: Math.max(0, Math.round(fps * 10) / 10) });
              if (window.__pspPerfSamples.length > 90) window.__pspPerfSamples.shift();
            }
            lastFrame = frame;
            lastTime = now;
          } catch (_) {}
        }, 1000);
      }
      function installDriveFetchAuth(){
        if (!fileId || !token || window.__forbiddensDriveFetchAuthInstalled) return;
        window.__forbiddensDriveFetchAuthInstalled = true;
        var originalFetch = window.fetch.bind(window);
        window.fetch = function(input, init){
          try {
            var url = typeof input === "string" ? input : input && input.url;
            if (url && url.indexOf("https://www.googleapis.com/drive/v3/files/") === 0 && url.indexOf("alt=media") !== -1) {
              var cleanUrl = new URL(url);
              cleanUrl.searchParams.delete("access_token");
              var headers = new Headers((init && init.headers) || {});
              headers.set("Authorization", "Bearer " + token);
              return originalFetch(cleanUrl.toString(), Object.assign({}, init || {}, {
                headers: headers,
                mode: "cors",
                credentials: "omit"
              }));
            }
          } catch (_) {}
          return originalFetch(input, init);
        };
      }
      async function boot(){
        if (pickLocal && !objectUrl) return showLocalPicker();
        if (!fileId && !romUrl && !objectUrl) return fail("No se recibio el archivo PSP.");
        if (!crossOriginIsolated || typeof SharedArrayBuffer === "undefined") {
          return fail("Esta ventana no tiene aislamiento activo para PSP.");
        }
        if (fileId && (!token || Date.now() >= expiry)) {
          return fail("La sesion de Google Drive expiro. Vuelve a sincronizar Drive.");
        }

        try {
          await clearOldEmulatorCache();
          prefetchAssets();

          if (objectUrl) {
            setMessage("Preparando ROM...", 92);
          } else if (romUrl) {
            objectUrl = romUrl;
            setMessage("Preparando ROM...", 92);
          } else {
            var meta = await fetchDriveMetadata(fileId);
            if (meta && meta.name && (!gameName || gameName === "Juego PSP")) {
              gameName = meta.name;
              document.title = gameName;
            }
            if (directDrive) {
              installDriveFetchAuth();
              objectUrl = "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?alt=media";
              setMessage("Entregando ROM de Drive a EmulatorJS" + (meta && meta.size ? " (" + formatBytes(Number(meta.size)) + ")" : "") + "...", 28);
            } else {
              setMessage("Descargando ROM...", 12);
              var response = await fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?alt=media", {
                headers: { Authorization: "Bearer " + token }
              });
              if (!response.ok) throw new Error("Drive respondio " + response.status);
              var blob = await readResponseBlob(response, meta && meta.size ? Number(meta.size) : 0);
              objectUrl = URL.createObjectURL(blob);
            }
          }

          setMessage("Iniciando PSP...", 98);

          window.EJS_player = "#game";
          window.EJS_core = "ppsspp";
          window.EJS_gameUrl = objectUrl;
          window.EJS_gameName = gameName;
          window.EJS_pathtodata = location.origin + "/emulatorjs-data/";
          window.EJS_startOnLoaded = true;
          window.EJS_threads = true;
          window.EJS_language = "es-ES";
          window.EJS_CacheLimit = 67108864;
          window.EJS_cacheConfig = { enabled:false };
          window.EJS_disableLocalStorage = true;
          window.EJS_fixedSaveInterval = 0;
          window.EJS_dontExtractRom = true;
          window.EJS_color = "#00f2fe";
          window.EJS_backgroundColor = "#000000";
          window.EJS_defaultOptions = getPspOptions();
          window.EJS_onGameStart = function(){
            startPerfSampler();
            setMessage("PSP en ejecucion", 100);
            setTimeout(function(){ loading.style.display = "none"; }, 350);
          };

          var script = document.createElement("script");
          script.src = "/emulatorjs-data/loader.js";
          script.onerror = function(){ fail("No se pudo cargar EmulatorJS."); };
          document.body.appendChild(script);
        } catch (error) {
          fail(error && error.message ? error.message : "No se pudo iniciar PSP.");
        }
      }

      window.addEventListener("beforeunload", function(){
        if (objectUrl && objectUrl.startsWith("blob:")) URL.revokeObjectURL(objectUrl);
      });

      boot();
    })();
  </script>
</body>
</html>
